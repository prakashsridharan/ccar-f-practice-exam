{id:"Q50",s:4,d:3,ty:"single",q:"During a multi-phase exploration task, the agent's discovery phase produces thousands of lines of Grep results, file contents, and dependency traces. By the time it reaches the implementation phase, context is exhausted and the agent can barely produce any code. How should the discovery and implementation phases be separated?",o:[{l:"A",t:"Increase max_tokens to accommodate both phases"},{l:"B",t:"Delegate the verbose discovery phase to an Explore subagent that returns a condensed summary - the main session receives only the distilled findings and retains full context budget for implementation"},{l:"C",t:"Disable Grep and Glob tools to prevent verbose discovery output"},{l:"D",t:"Run discovery and implementation in the same session but use /compact between phases"}],a:["B"],r:"The Explore subagent isolates verbose discovery output in its own context. The main session receives only the distilled summary - key findings, relevant file paths, architectural observations - preserving its context budget for the implementation phase.",w:"A doesn't solve attention quality; C removes essential exploration tools; D helps but still leaves discovery artifacts in the compressed context."},
{id:"Q51",s:4,d:1,ty:"single",q:"You are asked to \"add comprehensive tests to a legacy codebase\" with no further specification. Nobody knows which modules are highest-risk, what the dependency structure looks like, or where the test coverage gaps are worst. Which decomposition approach fits this open-ended task?",o:[{l:"A",t:"Write tests file-by-file in alphabetical directory order until done"},{l:"B",t:"Generate all tests in a single large request, covering the entire codebase at once"},{l:"C",t:"First map the codebase structure and identify high-impact areas, then create a prioritized test plan that adapts as dependencies and surprises are discovered during implementation"},{l:"D",t:"Test only code modified in the last month, since recent changes are most likely to have bugs"}],a:["C"],r:"Open-ended tasks with unknown scope require adaptive decomposition: understand the terrain first, prioritize by impact and risk, then let the plan evolve as each step reveals new information. A fixed sequence (A, B) or arbitrary filter (D) ignores what makes the task open-ended.",w:"A spends effort by filename order rather than risk; B asks one pass to do what requires progressive discovery; D uses recency as a proxy for importance when legacy risk often lives in old, untouched code."},{id:"Q52",s:5,d:3,ty:"single",q:"Your CI pipeline script runs claude \"Analyze this pull request for security issues\" but the job hangs indefinitely in the CI environment. Logs show Claude Code is waiting for interactive terminal input. The pipeline eventually times out after 30 minutes. What is the correct way to invoke Claude Code in an automated, non-interactive pipeline?",o:[{l:"A",t:"Set the environment variable CLAUDE_HEADLESS=true before running the command"},{l:"B",t:"Redirect stdin from /dev/null: claude \"Analyze...\" < /dev/null"},{l:"C",t:"Use the -p flag: claude -p \"Analyze this pull request for security issues\" - this runs non-interactively, processes the prompt, outputs the result to stdout, and exits"},{l:"D",t:"Add the --batch flag: claude --batch \"Analyze...\""}],a:["C"],r:"The -p (or --print) flag is the documented mechanism for non-interactive execution. It processes the prompt, writes the result to stdout, and exits without waiting for terminal input - exactly what CI/CD pipelines require.",w:"A references a non-existent environment variable; B is a Unix workaround that doesn't properly address Claude Code's interaction model; D references a non-existent flag."},
{id:"Q53",s:5,d:3,ty:"single",q:"Your CI pipeline generates tests automatically on each PR, but developers reject 80% of them. Rejected tests consistently ignore your team's fixture library (duplicating setup code), test trivial getters/setters, and use assertion patterns your team considers unreadable. The test generation prompt says \"write comprehensive tests for the changed files.\" What is the configuration-level fix?",o:[{l:"A",t:"Generate three times as many tests so more survive the review process"},{l:"B",t:"Have developers manually rewrite every generated test as a standing practice"},{l:"C",t:"Lower the temperature to 0.0 for more deterministic test output"},{l:"D",t:"Document testing standards (what makes a test valuable, which patterns to use), the available fixture library, and example tests in CLAUDE.md - the mechanism that provides project context to CI-invoked Claude Code"}],a:["D"],r:"CI invocations get their project context from CLAUDE.md. Standards, value criteria, fixture documentation, and example tests directly raise generation quality - the model can only follow conventions it has been shown. Without this context, it falls back to generic test patterns.",w:"A scales the reject pile; B institutionalizes rework instead of fixing the cause; C reduces variability of output that is uninformed either way."},
{id:"Q54",s:5,d:3,ty:"single",q:"Your automated review bot re-runs after each new commit to a PR. After the third commit, developers have muted the bot because it re-posts the exact same 12 findings on every run - even findings they've already addressed. The signal-to-noise ratio has collapsed. How should incremental re-reviews be designed?",o:[{l:"A",t:"Include the prior review's findings in the context and instruct Claude to report only new issues introduced by the latest commit or previously-flagged issues that remain unaddressed in the current code"},{l:"B",t:"Review only the latest commit's diff in isolation, ignoring all prior context"},{l:"C",t:"Limit the bot to one review per PR regardless of subsequent commits"},{l:"D",t:"Re-post all findings but use different formatting (e.g., bullet points instead of numbered lists) to make them appear fresh"}],a:["A"],r:"Duplicate suppression is a context design problem: provide the reviewer with its own prior findings and explicitly instruct it to report deltas - new issues plus unresolved carryovers. This maintains complete coverage while eliminating the spam that causes developers to mute the bot.",w:"B misses issues that emerge from interaction between commits; C leaves everything after the first push unreviewed; D disguises the spam developers have already rejected."},
{id:"Q55",s:5,d:4,ty:"single",q:"Your review prompt says \"be conservative and only report high-confidence findings\" yet false positives remain at 35%, particularly in the data validation category. Adding \"be very, very conservative\" to the prompt had no measurable effect. What does effective precision engineering look like for automated code review?",o:[{l:"A",t:"Add \"CRITICAL: minimize false positives\" in all caps at the top of the prompt"},{l:"B",t:"Report all findings but sort them by the model's self-reported confidence score, letting developers focus on the top of the list"},{l:"C",t:"Replace vague confidence-based language with explicit categorical criteria: define exactly which issue types to report (bugs, security vulnerabilities, data loss risks) and which to skip (minor style preferences, local naming conventions), with concrete boundary examples"},{l:"D",t:"Reduce the number of files reviewed per run so the model has more attention per file"}],a:["C"],r:"Vague conservatism doesn't transfer to the model - it has no operational definition of \"conservative.\" Specific categorical criteria with concrete boundaries give the model a clear, actionable decision rule: report bugs and security issues, skip style nitpicks. This is what actually moves the precision needle.",w:"A intensifies an instruction that already has no operational content; B reorders noise rather than reducing it; D reviews less code with the same faulty judgment."},
{id:"Q56",s:5,d:4,ty:"single",q:"Your reviewer consistently flags intentional code patterns as bugs - for example, intentional switch fall-throughs marked with /* falls through */ comments, and empty catch blocks with // intentionally swallowed comments. Detailed prose instructions like \"do not flag intentional patterns\" haven't fixed the problem because the model can't reliably distinguish \"intentional\" from \"accidental\" based on prose alone. What is the most effective addition?",o:[{l:"A",t:"A blanket rule that anything with a code comment is acceptable and should never be flagged"},{l:"B",t:"An instruction to \"use good engineering judgment about which patterns are intentional\""},{l:"C",t:"2-4 few-shot examples showing paired cases: an intentional fall-through with a comment (not reportable, with reasoning) alongside an accidental fall-through without a comment (reportable, with reasoning) - enabling the model to generalize the judgment to novel patterns"},{l:"D",t:"Exclude all files containing switch statements or try-catch blocks from review"}],a:["C"],r:"When prose fails to convey a judgment boundary, contrasted few-shot examples carry it. Showing matched pairs of acceptable vs. problematic patterns with explicit reasoning teaches a distinction the model can generalize to novel code - the documented strength of few-shot prompting for false positive reduction.",w:"A creates a rule any commented bug defeats; B restates the goal without providing the judgment; D removes exactly the code that most needs careful review."},
{id:"Q57",s:5,d:4,ty:"single",q:"Your team wants to reduce API costs for two automated workflows: (1) a nightly technical debt report generated overnight for review the next morning, and (2) a blocking pre-merge check that must complete before developers can merge their PRs. Your manager proposes switching both to the Message Batches API for its 50% cost savings. How should you evaluate this proposal?",o:[{l:"A",t:"Switch both workflows to batch processing - the cost savings justify the latency tradeoff for both"},{l:"B",t:"Use batch processing for the overnight technical debt reports only; keep the pre-merge checks on the synchronous Messages API since batch processing can take up to 24 hours with no guaranteed latency SLA"},{l:"C",t:"Keep both on the synchronous API - batch processing can't correlate requests with responses"},{l:"D",t:"Switch both to batch with a fallback to synchronous if batch takes longer than 2 hours"}],a:["B"],r:"The batch API's up to 24-hour processing window with no latency SLA makes it unsuitable for blocking developer workflows where someone is waiting. Overnight reports are the ideal batch profile - latency-tolerant, non-blocking, and cost-sensitive. Each workflow matches to the API that fits its latency requirements.",w:"A blocks developers behind a 24-hour window; C is incorrect - custom_id fields exist for request/response correlation; D adds complexity for a problem that has a clean architectural split."},
{id:"Q58",s:5,d:4,ty:"single",q:"You notice that when the same Claude Code session generates code and then reviews it, the review is conspicuously gentle - approving patterns that an independent reviewer flags as problematic. The generated code has an off-by-one error in a loop boundary that the same-session review calls \"a reasonable implementation choice\" while a fresh instance immediately identifies it as a bug. What explains this, and what is the design implication?",o:[{l:"A",t:"The model is being polite - add an instruction to \"review harshly and assume bugs exist\""},{l:"B",t:"The generating session retains the reasoning context that produced the code, making it less likely to question its own decisions - CI reviews should always run in an independent instance without the generator's reasoning context"},{l:"C",t:"Reviews should always use a larger, more capable model tier than the generator"},{l:"D",t:"Wait at least 24 hours between generation and review so the session context \"decays\""}],a:["B"],r:"Self-review bias stems from shared reasoning context: the model that produced the code retains the logic that justified each decision, making it inherently less likely to identify problems. An independent instance evaluates the code on its own terms, without the generator's confirming context.",w:"A misreads a structural context effect as a personality setting; C changes capability when the problem is contaminated context; D incorrectly assumes context degrades over time."},
{id:"Q59",s:5,d:4,ty:"single",q:"After processing a batch of 10,000 documents overnight, 200 fail: most are oversized documents that exceeded context limits, plus some transient API timeouts. You need to handle these failures efficiently without reprocessing the 9,800 documents that succeeded. How do you identify and resubmit only the failures?",o:[{l:"A",t:"Resubmit the entire 10,000-document batch and discard duplicate results for the 9,800 that already succeeded"},{l:"B",t:"Identify the 200 failed requests by their custom_id fields, fix the underlying causes (e.g., chunk the oversized documents into smaller segments), and resubmit only the fixed subset"},{l:"C",t:"Accept the 200 failures as a 2% loss rate and proceed with the 9,800 successful results"},{l:"D",t:"Switch the 200 failures to the synchronous API, which doesn't have context limits"}],a:["B"],r:"custom_id fields exist precisely for this: correlating each request with its response, identifying failures, fixing their causes (chunking oversized docs, retrying after transient errors), and resubmitting only the corrected subset. This is efficient and addresses root causes.",w:"A reprocesses 9,800 successes to handle 200 failures; C silently drops 2% of the corpus; D misunderstands that context limits apply to the model regardless of API mode."},{id:"Q60",s:6,d:4,ty:"single",q:"Your extraction pipeline currently asks Claude to \"respond with JSON\" in the system prompt. Downstream systems parsing the output break regularly because responses sometimes include markdown code fences (```json ... ```), trailing conversational text (\"Here's the extracted data: ...\"), and occasionally malformed JSON syntax. What is the most reliable structural fix?",o:[{l:"A",t:"Strengthen the prompt: \"Respond ONLY with valid JSON, no markdown, no commentary, no exceptions\""},{l:"B",t:"Post-process the output with regex to strip code fences, remove trailing text, and attempt JSON repair"},{l:"C",t:"Define the extraction as a tool whose input parameters use your JSON schema, and read the structured data from the tool_use response block - guaranteeing schema-compliant output and eliminating syntax errors by construction"},{l:"D",t:"Switch from JSON to XML output, which models tend to format more carefully"}],a:["C"],r:"Tool use with JSON schemas is the reliability mechanism for structured output: the model's extraction arrives as schema-validated tool input, not as free text that happens to contain JSON. Syntax errors and extraneous text are eliminated by construction, not by post-processing.",w:"A improves odds within a fundamentally text-shaped channel; B patches symptoms with fragile regex; D relocates the same free-text problem to a different syntax."},
{id:"Q61",s:6,d:4,ty:"single",q:"You have separate extraction tools for invoices, contracts, and medical records - each with its own JSON schema. Incoming documents arrive with unknown types, and the system must always produce a structured extraction (never a conversational text response). The model should determine which schema fits each document. Which tool_choice setting is correct?",o:[{l:"A",t:"tool_choice: \"auto\" - let the model decide whether to call a tool or respond with text"},{l:"B",t:"tool_choice: \"any\" - the model must call a tool (guaranteeing structured output) but can choose which extraction tool fits the document type"},{l:"C",t:"tool_choice forced to the invoice extraction tool for all documents, since invoices are the most common type"},{l:"D",t:"Omit tool_choice entirely and rely on the system prompt instruction to \"always extract structured data\""}],a:["B"],r:"\"any\" compels a tool call while preserving the model's choice among schemas - exactly right for unknown document types that must always yield structured output. \"auto\" (and omitting tool_choice, which defaults to auto) allows conversational text responses, breaking the pipeline.",w:"A and D permit text responses that break downstream systems; C applies a single schema to all document types regardless of fit."},
{id:"Q62",s:6,d:4,ty:"single",q:"Your invoice extraction schema marks vendor_tax_id as a required field. On approximately 15% of invoices (particularly from small vendors and international suppliers), no tax ID appears anywhere in the document. The model fabricates plausible-looking tax IDs to satisfy the required field constraint, and these fabrications pass format validation but fail when checked against government databases. What is the schema-level fix?",o:[{l:"A",t:"Add a prompt instruction: \"If the tax ID is not visible in the document, enter 'NOT FOUND' as the value\""},{l:"B",t:"Post-validate all tax IDs against a government database and discard failures - catching fabrications after the fact"},{l:"C",t:"Lower the model temperature so fabricated values are less creative and more obviously fake"},{l:"D",t:"Make vendor_tax_id optional or nullable in the schema, so the model can legitimately return null when the information is absent from the source document"}],a:["D"],r:"Required fields on possibly-absent information structurally force fabrication - the schema offers no honest answer. Making the field nullable gives the model a legitimate way to represent \"this information doesn't exist in the source,\" which is the truthful extraction.",w:"A provides a workaround but doesn't fix the structural pressure; B catches fabrications after they've entered the pipeline; C makes fabrications less creative, not less fabricated."},
{id:"Q63",s:6,d:4,ty:"single",q:"Since adopting tool_use with JSON schemas, your extractions are always syntactically valid - no more parsing errors. However, quality review reveals that on 8% of invoices, line item amounts don't sum to the stated total, and vendor names occasionally appear in the address field. The engineering team expected tool_use to prevent all extraction errors. What should you understand and do?",o:[{l:"A",t:"Tool use with schemas was falsely advertised - it should prevent semantic errors too"},{l:"B",t:"Schema compliance guarantees syntactic validity (correct JSON structure, field types, required fields) but not semantic correctness (values making logical sense). Add a semantic validation layer - e.g., extract calculated_total alongside stated_total and flag discrepancies with a conflict_detected boolean field"},{l:"C",t:"Make every field an unconstrained string type so nothing can be structurally wrong"},{l:"D",t:"Re-run each extraction multiple times until the line items happen to sum correctly"}],a:["B"],r:"Tool use draws a clear boundary: it guarantees structure (valid JSON, correct types, required fields present) but not truth (values being logically correct, fields containing appropriate data). Semantic validation - cross-checks, calculated totals, consistency flags - is a separate necessary layer.",w:"A misunderstands the guarantee's scope; C destroys the structural benefits; D retries until errors align by chance."},
{id:"Q64",s:6,d:4,ty:"single",q:"An extraction fails Pydantic validation with two specific field errors: the date field contains \"next Tuesday\" instead of ISO format, and the amount field has \"approximately $500\" instead of a numeric value. You plan to retry. What should the retry request contain, and when should you skip retrying altogether?",o:[{l:"A",t:"Just the instruction \"try again more carefully\" - the model will remember the document from the prior attempt"},{l:"B",t:"Only the two validation error messages, without the original document - to keep the retry prompt short"},{l:"C",t:"The original source document, the failed extraction output, and the specific validation errors - enabling targeted self-correction. Skip retrying when the required information is simply absent from the source document, since no number of retries can produce data that doesn't exist"},{l:"D",t:"A different source document to give the model a fresh start on an easier example"}],a:["C"],r:"Retry-with-error-feedback works because the model sees what it produced, exactly what was wrong, and the source document to correct against. The critical boundary: format/structural errors (\"next Tuesday\" → ISO date) are retryable; genuinely absent information is not - no retry can extract what isn't there.",w:"A retries blind without showing the errors; B removes the source document the correction requires; D abandons the failed document instead of fixing the extraction."},
{id:"Q65",s:6,d:4,ty:"single",q:"Your extraction schema needs a document_category field. Most documents fall into well-defined categories (invoice, contract, receipt, statement), but approximately 5% don't fit any predefined category - cover letters, internal memos, handwritten notes. Currently the model forces these into the closest predefined category, creating systematic misclassification. What schema design pattern accommodates novel categories?",o:[{l:"A",t:"Make document_category a free-text string so the model can write anything"},{l:"B",t:"Define document_category as an enum with the predefined values plus an \"other\" option, paired with a separate category_detail string field where the model describes the novel category"},{l:"C",t:"Add every possible document type to the enum - even rare ones - to eliminate the \"other\" case"},{l:"D",t:"Remove the category field entirely since it can't handle all cases"}],a:["B"],r:"The enum + \"other\" + detail string pattern provides structured categorization for known values while gracefully handling novel categories. The enum constrains the common cases; \"other\" + detail captures edge cases with descriptive text rather than forced misclassification.",w:"A loses all categorization structure; C can't anticipate every possible document type; D removes a useful field instead of designing it properly."},
{id:"Q66",s:6,d:4,ty:"single",q:"An extraction pipeline processes documents with varied date formats (\"03/15/2025\", \"15-Mar-25\", \"March 15th, 2025\", \"Q1 2025\"). Extracted dates are inconsistent - sometimes MM/DD/YYYY, sometimes DD/MM/YYYY, sometimes natural language. How do you ensure consistent output formatting across all input variations?",o:[{l:"A",t:"Make all date fields optional so the model can skip dates it can't parse"},{l:"B",t:"Include format normalization instructions in the prompt (\"always output dates as YYYY-MM-DD\") alongside few-shot examples showing correct parsing of each variant format"},{l:"C",t:"Post-process all dates with a regex-based parser after extraction"},{l:"D",t:"Restrict the pipeline to only accept documents with ISO-formatted dates"}],a:["B"],r:"Format normalization instructions specify the expected output format, and few-shot examples demonstrate correct handling of each input variant. Together they teach the model to produce consistent YYYY-MM-DD output regardless of how dates appear in the source.",w:"A avoids the problem instead of solving it; C is fragile with varied input formats; D rejects valid documents."},
{id:"Q67",s:6,d:2,ty:"single",q:"A single analyze_document MCP tool handles three distinct operations - extraction, summarization, and claim verification - selected by a mode parameter. The agent frequently selects the wrong mode: using \"extract\" when it should verify, and \"summarize\" when it should extract. Results are inconsistent and debugging is difficult because the tool's behavior depends on a parameter the model struggles to select correctly. What is the recommended redesign?",o:[{l:"A",t:"Add a fourth \"auto\" mode that internally detects the correct operation"},{l:"B",t:"Write a much longer tool description explaining each mode in detail"},{l:"C",t:"Reduce to two modes by merging extraction and summarization"},{l:"D",t:"Split into three purpose-specific tools - extract_data_points, summarize_content, verify_claim_against_source - each with its own clear description, input schema, and output contract"}],a:["D"],r:"Purpose-specific tools turn a hidden mode decision into a visible tool selection decision - the thing tool descriptions are designed to guide. Each tool's contract is explicit, input/output expectations are clear, and misrouting drops because the model selects based on clear descriptions rather than opaque mode parameters.",w:"A buries the selection problem one layer deeper; B improves docs of an inherently ambiguous structure; C keeps the overloaded design with fewer options."},
{id:"Q68",s:6,d:2,ty:"single",q:"Your MCP extraction tool encounters a parsing failure when processing a corrupted PDF. It returns the message \"Error: could not parse document\" as an ordinary successful text result (isError not set). The agent then treats that error message as the document's content and attempts to \"extract\" fields from the sentence \"Error: could not parse document,\" producing nonsensical structured output with the vendor name \"Error\" and the amount \"could not.\" What is the correct MCP error handling pattern?",o:[{l:"A",t:"Prefix error messages with \"SYSTEM ERROR:\" so the agent recognizes them as errors through text conventions"},{l:"B",t:"Return the failure response with the MCP isError flag set, so the agent programmatically recognizes it as a tool failure rather than document content"},{l:"C",t:"Return an empty string on failure - the agent will recognize the absence of content"},{l:"D",t:"Throw an unhandled exception and let the MCP connection drop, forcing a retry"}],a:["B"],r:"The MCP isError flag is the designed channel for communicating tool failures. When set, the agent recognizes the response as an error condition and can reason about recovery - retry, skip, or escalate. Without it, error text is indistinguishable from legitimate content.",w:"A relies on the model inferring failure from prose conventions; C replaces a mislabeled failure with a silent one; D turns a recoverable tool error into a transport-level breakdown."},
{id:"Q69",s:6,d:5,ty:"single",q:"Your extraction system reports 97% aggregate accuracy across all document types, and leadership proposes eliminating human review for high-confidence extractions to reduce costs. Before approving this, what validation must be performed on the aggregate metric?",o:[{l:"A",t:"Accept the 97% aggregate as sufficient evidence - it exceeds the 95% threshold the team agreed on"},{l:"B",t:"Validate accuracy by document type and field segment - the 97% aggregate may mask systematically poor performance on specific document types (e.g., 60% accuracy on handwritten invoices) or specific fields (e.g., 70% on tax IDs)"},{l:"C",t:"Randomly sample 1% of all extractions for spot-checking"},{l:"D",t:"Review only extractions where the model itself flagged low confidence"}],a:["B"],r:"Aggregate accuracy can mask significant variance - near-perfect performance on common document types can compensate for poor performance on rare types. Per-segment validation ensures the system performs consistently before human review is reduced for any segment.",w:"A trusts a potentially misleading metric; C isn't targeted at segments where errors concentrate; D misses errors the model is confidently wrong about."},
{id:"Q70",s:6,d:2,ty:"single",q:"You need to sequence a multi-tool extraction workflow: extract_metadata must run first to produce a document classification and ID, then enrich_data uses that classification and ID to apply the correct extraction schema. If the model calls enrich_data first, it lacks the classification and produces incorrect extractions. How do you guarantee the correct tool sequence?",o:[{l:"A",t:"Add \"always call extract_metadata before enrich_data\" to the system prompt"},{l:"B",t:"Force extract_metadata first using tool_choice: {type: \"tool\", name: \"extract_metadata\"} in the initial request, then process the enrichment step in a follow-up turn with tool_choice reset to allow enrich_data"},{l:"C",t:"Merge both tools into a single extract_and_enrich tool that handles the sequence internally"},{l:"D",t:"Run both tools in parallel and hope extract_metadata completes first"}],a:["B"],r:"Forced tool selection with tool_choice guarantees the prerequisite tool executes first. The follow-up turn processes the dependent step after the prerequisite data is available. This provides a deterministic sequencing guarantee that prompt instructions cannot.",w:"A is probabilistic and may be ignored; C loses the modularity benefit of separate tools; D has no ordering guarantee."},{id:"Q71",s:4,d:1,ty:"single",q:"You are choosing decomposition strategies for two workflows: (1) a code review that always checks the same five aspects (security, error handling, naming, tests, documentation), and (2) a production incident investigation where each diagnostic step depends on what the previous finding reveals. Which pairing of decomposition patterns is correct?",o:[{l:"A",t:"Dynamic adaptive decomposition for both, since flexibility is always better than fixed structure"},{l:"B",t:"Prompt chaining for both, since fixed sequential steps are easier to test and debug"},{l:"C",t:"Prompt chaining (a fixed sequence of focused passes) for the predictable five-aspect review; dynamic adaptive decomposition for the incident investigation, where intermediate findings determine the next diagnostic step"},{l:"D",t:"Dynamic decomposition for the review; prompt chaining for the investigation"}],a:["C"],r:"The selection rule matches pattern to uncertainty: fixed sequential pipelines for predictable multi-aspect work, adaptive decomposition where the path emerges from intermediate findings. Each workflow gets the structure its uncertainty profile demands.",w:"A pays adaptivity overhead on a task with no uncertainty; B forces an investigation to follow pre-written steps that can't account for what each step reveals; D assigns each strategy to the workflow that defeats it."},
{id:"Q72",s:4,d:1,ty:"single",q:"You are writing AgentDefinition configurations for your developer productivity system's subagents. A junior engineer claims subagents automatically inherit the parent coordinator's conversation history and share memory between invocations. Which TWO corrections should you make?",o:[{l:"A",t:"Subagents do inherit conversation history but not tool results"},{l:"B",t:"Each subagent's AgentDefinition carries its own description, system prompt, and tool restrictions - and subagents do not share memory between invocations, so whatever context a subagent needs must be provided explicitly in its prompt"},{l:"C",t:"Subagents share memory through a global context store managed by the Task tool"},{l:"D",t:"Subagents inherit history only if spawned with the inheritContext: true flag"}],a:["B"],r:"Two fundamental facts about subagents: they are configured individually (own description, system prompt, tool restrictions), and they operate with complete isolation - no inherited history, no shared memory across invocations. Context passing is always explicit.",w:"A, C, and D describe inheritance and sharing mechanisms that don't exist. The isolation model is by design, not a limitation to work around."},
{id:"Q73",s:4,d:2,ty:"single",q:"Your team has a fetch_url tool that accepts any URL and returns the page content. Agents frequently misuse it to fetch non-document URLs (API endpoints, binary files, internal admin pages), causing errors and security concerns. The tool is primarily needed for loading research documents. What is the recommended redesign?",o:[{l:"A",t:"Add a longer description warning agents not to fetch non-document URLs"},{l:"B",t:"Replace fetch_url with a constrained alternative like load_document that validates URLs against a document-URL pattern before fetching, preventing misuse by design"},{l:"C",t:"Remove the tool entirely and paste document contents manually"},{l:"D",t:"Add a routing classifier that pre-approves each URL before the tool executes"}],a:["B"],r:"Replacing a generic tool with a constrained alternative narrows the tool's attack surface by design. load_document can validate that URLs match expected document patterns before fetching, making misuse structurally impossible rather than relying on the agent's judgment.",w:"A is probabilistic guidance; C removes useful capability; D adds complexity for something the tool itself should enforce."},
{id:"Q74",s:4,d:2,ty:"single",q:"Your developer productivity agent needs to trace how a function is used across a codebase that heavily uses wrapper modules. The function calculate_tax is re-exported through three wrapper files before being called in the actual business logic. Simply grepping for 'calculate_tax' misses the intermediate wrapper names (taxHelper, computeTax, getTaxAmount). What is the correct multi-step exploration approach?",o:[{l:"A",t:"Read every file in the project and search manually through the contents"},{l:"B",t:"First identify all exported names from the file containing calculate_tax, then Grep for each re-exported name across the codebase to trace through the wrapper chain"},{l:"C",t:"Ask the developer which wrapper names are used"},{l:"D",t:"Use Glob to find all files containing 'tax' in the filename"}],a:["B"],r:"Tracing through wrapper modules requires following the export chain: identify what names the original file exports, then search for each of those names to find where they're re-exported or consumed. This builds the complete usage graph across indirection layers.",w:"A exhausts context; C outsources the agent's job; D finds files by name but not by usage patterns."},
{id:"Q75",s:5,d:4,ty:"single",q:"Your automated review system needs to produce findings that can be automatically posted as inline PR comments by your CI pipeline. Currently, reviews output prose paragraphs that require manual parsing. What CI invocation produces machine-parseable structured findings?",o:[{l:"A",t:"claude 'review this PR' piped through grep to extract findings from the prose"},{l:"B",t:"claude -p 'review this PR' with --output-format json and --json-schema, producing structured findings your pipeline can parse and post without manual intervention"},{l:"C",t:"claude --batch 'review this PR' --format=structured"},{l:"D",t:"claude -p 'review this PR' alone, then regex-parsing the text output for file paths and line numbers"}],a:["B"],r:"The CI trio: -p for non-interactive execution, --output-format json for machine-readable output, and --json-schema to enforce the exact findings structure your pipeline consumes. No prose parsing, no input hangs, no fragile regex.",w:"A hangs waiting for interactive input; C references non-existent flags; D solves the hang but leaves the pipeline regex-parsing unstructured text."},
{id:"Q76",s:5,d:3,ty:"single",q:"Your CI pipeline generates tests for changed code, but the generated tests frequently suggest test scenarios that are already covered by the existing test suite, wasting reviewer time on duplicates. What should you provide in the CI context to prevent this?",o:[{l:"A",t:"Generate tests only for files that have zero existing tests"},{l:"B",t:"Include the existing test files in context so test generation can see what scenarios are already covered and avoid suggesting duplicates"},{l:"C",t:"Limit test generation to one test per changed file"},{l:"D",t:"Have developers delete generated tests that duplicate existing ones as a standing practice"}],a:["B"],r:"Providing existing test files in context lets the generator see what's already covered and focus on genuinely missing scenarios. Without this visibility, it proposes tests from scratch and inevitably duplicates existing coverage.",w:"A skips files that might need additional test scenarios; C artificially limits coverage; D institutionalizes rework instead of preventing it."},
{id:"Q77",s:5,d:4,ty:"single",q:"Your review system's severity classification is inconsistent - nearly identical issues get labeled 'critical' one day and 'minor' the next, making severity-based merge gates unreliable. Developers can't trust the severity labels. How do you achieve consistent classification?",o:[{l:"A",t:"Remove severity levels entirely and treat all findings equally"},{l:"B",t:"Let the model freely assign severity but average across five independent runs"},{l:"C",t:"Define explicit severity criteria with concrete code examples for each level - e.g., 'critical: authentication bypass, SQL injection' vs 'minor: inconsistent variable naming' - giving every severity an operational definition the model can match against"},{l:"D",t:"Map severity to the number of lines of code affected by the issue"}],a:["C"],r:"Consistency comes from operational definitions: severity levels anchored by concrete code examples give the classifier something to match rather than interpret. This turns subjective judgment into a rubric, making severity gates dependable.",w:"A discards the signal merge gates need; B statistically launders an unanchored judgment; D measures code size, not impact - a one-line auth bypass outranks a fifty-line comment tweak."},
{id:"Q78",s:5,d:4,ty:"single",q:"The 'code style' finding category in your automated reviewer has a 70% false positive rate. Developers have begun dismissing all findings - including accurate security findings - because trust in the entire system has collapsed. What is the right operational response?",o:[{l:"A",t:"Ship even more style findings to demonstrate the category's value"},{l:"B",t:"Temporarily disable the style category to restore developer trust in the accurate categories, then improve the style prompts offline before re-enabling"},{l:"C",t:"Rename 'code style' to 'code quality' so it sounds more important"},{l:"D",t:"Ask developers to be more tolerant of noise during the tuning period"}],a:["B"],r:"High false-positive categories are contagious - they teach developers to dismiss everything. Disabling the offender protects the credibility of accurate categories (like security) while the noisy category's prompts are improved offline. Trust is the system's real asset.",w:"A doubles down on trust-destroying noise; C relabels the same false positives; D asks humans to absorb a cost the system's configuration should eliminate."},
{id:"Q79",s:2,d:3,ty:"single",q:"A developer wants to use Claude Code's interview pattern before implementing a caching layer in an unfamiliar domain. They want Claude to ask probing questions about cache invalidation strategies, failure modes, and consistency requirements before writing any code. How should this interaction be structured?",o:[{l:"A",t:"Write a detailed specification upfront covering all caching concerns, then have Claude implement it"},{l:"B",t:"Ask Claude to implement caching immediately and iterate based on bugs found in testing"},{l:"C",t:"Use the interview pattern: ask Claude to surface considerations and ask questions about the domain before implementing, so it identifies cache invalidation strategies, failure modes, and edge cases the developer may not have anticipated"},{l:"D",t:"Find an existing caching library and have Claude integrate it without discussion"}],a:["C"],r:"The interview pattern has Claude ask probing questions to surface design considerations before implementation. In unfamiliar domains like caching, this identifies invalidation strategies, failure modes, and consistency requirements the developer may not have considered - leading to a more robust implementation.",w:"A assumes the developer already knows all the concerns; B discovers problems through bugs rather than design; D skips the design discussion entirely."},
{id:"Q80",s:2,d:3,ty:"single",q:"Your test suite has failing edge cases: a migration script crashes on null values in the source data. You want Claude Code to fix the handling. Should you describe the problem in prose, or provide something more concrete?",o:[{l:"A",t:"Describe the problem: 'the migration script doesn't handle null values properly'"},{l:"B",t:"Provide specific failing test cases with example input containing null values and the expected output, so Claude can see exactly what's wrong and target the fix"},{l:"C",t:"Lower the temperature for more precise code generation"},{l:"D",t:"Ask Claude to rewrite the entire migration script from scratch"}],a:["B"],r:"Specific test cases with example input and expected output communicate the exact behavior boundary far more reliably than prose descriptions. Claude can see the null value that causes the crash, the expected handling, and write a targeted fix.",w:"A is vague about which null values and what handling is expected; C doesn't improve understanding of the problem; D is overkill for an edge case fix."},
{id:"Q81",s:2,d:1,ty:"single",q:"You want to resume last week's refactoring session, but since then the team has merged substantial changes across 15 of the 20 files the session analyzed. Most of the session's tool results now describe code that no longer exists. What is the reliable approach?",o:[{l:"A",t:"Resume the session as-is and trust Claude to automatically detect which files changed"},{l:"B",t:"Start a new session seeded with a structured summary of the prior session's conclusions and key decisions - stale tool results make direct resumption unreliable since the model will reason from outdated file contents"},{l:"C",t:"Resume the session and increase max_tokens to accommodate the additional confusion from stale results"},{l:"D",t:"Never resume sessions - always start completely from scratch regardless of how much work was done"}],a:["B"],r:"The resumption tradeoff: resume when prior context is mostly valid; start fresh with an injected summary when tool results have gone stale. With 75% of files changed, the prior tool results are more misleading than helpful - keep the conclusions, discard the outdated evidence.",w:"A assumes automatic re-verification that doesn't happen; C spends tokens on a correctness problem; D throws away a valid technique for cases where files haven't changed."},
{id:"Q82",s:3,d:1,ty:"single",q:"Your research coordinator's task decomposition is too narrow: asked to research 'impact of AI on creative industries,' it decomposed the topic into only 'AI in digital art,' 'AI in graphic design,' and 'AI in photography' - completely missing music, writing, film, and game development. The subagents executed their narrow assignments correctly. What is the root cause?",o:[{l:"A",t:"The subagents need larger context windows to cover more creative domains"},{l:"B",t:"The coordinator's task decomposition is too narrow, resulting in subagent assignments that don't cover all relevant domains of the research topic"},{l:"C",t:"The web search subagent's queries weren't comprehensive enough"},{l:"D",t:"The synthesis agent should have identified the coverage gaps and filled them with general knowledge"}],a:["B"],r:"The coordinator's logs reveal the root cause directly: it decomposed 'creative industries' into only visual arts subtasks, completely omitting music, writing, film, and games. The subagents worked correctly within their assigned scope - the problem is what they were assigned, not how they executed.",w:"A, C, and D incorrectly blame downstream agents that performed their narrow assignments correctly. The decomposition is where coverage is determined."},
{id:"Q83",s:3,d:2,ty:"single",q:"Your synthesis subagent frequently needs to verify specific claims while combining research findings - checking dates, confirming statistics, validating names. Currently, each verification requires a round trip through the coordinator to the web search subagent, adding 2-3 extra turns per task. 85% of verifications are simple fact-checks; 15% require deeper investigation. What is the most effective optimization?",o:[{l:"A",t:"Give the synthesis agent access to all web search tools so it can handle any verification directly"},{l:"B",t:"Have the synthesis agent batch all verification needs and return them to the coordinator at the end"},{l:"C",t:"Give the synthesis agent a scoped verify_fact tool for simple lookups, while complex verifications continue routing through the coordinator to the web search subagent"},{l:"D",t:"Have the web search agent proactively cache extra context around each source during initial research"}],a:["C"],r:"A scoped verify_fact tool handles the 85% simple case directly, eliminating round trips. Complex verifications (15%) still route through the coordinator, preserving the separation of concerns. This applies the principle of least privilege - the synthesis agent gets only what it needs for common cases.",w:"A over-provisions the synthesis agent, violating separation of concerns; B creates blocking dependencies; D relies on speculative caching that can't predict verification needs."},
{id:"Q84",s:3,d:5,ty:"single",q:"Your multi-agent system produces reports that mix financial data, news summaries, and technical specifications. Currently, synthesis converts everything into uniform prose paragraphs, making financial tables hard to read and technical specs unclear. How should the synthesis output handle different content types?",o:[{l:"A",t:"Convert everything to bullet points for consistency"},{l:"B",t:"Render different content types in their natural format - financial data as tables, news as prose summaries, technical findings as structured lists - rather than forcing everything into a uniform format"},{l:"C",t:"Present all data as raw JSON for downstream processing"},{l:"D",t:"Let the synthesis agent choose whatever format feels natural for each section"}],a:["B"],r:"Different content types have natural presentation formats that preserve their readability and utility. Financial data reads best as tables, narrative content as prose, technical specs as structured lists. Forcing everything into one format loses the information structure.",w:"A loses table structure; C is for machines not readers; D is too vague to produce consistent results."},
{id:"Q85",s:3,d:5,ty:"single",q:"Subagents in your research system return verbose findings - full article excerpts, lengthy reasoning chains, and exploratory dead ends. By the time three subagents' outputs are aggregated, the synthesis agent's context is overwhelmed and it produces shallow summaries. What should change about how subagents structure their output?",o:[{l:"A",t:"Have subagents return raw, unprocessed findings so nothing is lost"},{l:"B",t:"Modify subagents to return structured data - key facts, citations, and relevance scores - instead of verbose content and reasoning chains, respecting the downstream context budget"},{l:"C",t:"Give the synthesis agent a larger context window to handle the volume"},{l:"D",t:"Reduce the number of subagents to two to limit output volume"}],a:["B"],r:"When downstream agents have limited context budgets, upstream agents should return structured, distilled data rather than verbose content. Key facts, citations, and relevance scores communicate the essential findings without the reasoning chains and dead ends that consume context.",w:"A maximizes the problem; C postpones it at higher cost; D reduces research breadth to solve a formatting problem."},{id:"Q86",s:1,d:1,ty:"single",q:"A customer asks about a policy that doesn't exist in your knowledge base - they want to know if your company matches competitor prices. Your return policy only covers price adjustments for items purchased on your own website. The agent cannot find any applicable policy. What should the agent do?",o:[{l:"A",t:"Apply the own-site price adjustment policy since it's the closest match to competitor price matching"},{l:"B",t:"Tell the customer no such policy exists and close the case"},{l:"C",t:"Escalate to a human agent - when policy is ambiguous or silent on the customer's specific request, this is an appropriate escalation trigger rather than improvising a policy the agent isn't authorized to create"},{l:"D",t:"Offer a 10% discount as a goodwill gesture to resolve the situation without involving policy"}],a:["C"],r:"Policy gaps - where the policy is silent or ambiguous on the customer's specific situation - are a legitimate escalation trigger. The agent should not improvise policy it's not authorized to create, nor should it dismiss the customer when a human might have the authority to help.",w:"A misapplies a different policy; B may be wrong if a policy exists that the agent hasn't found; D exceeds the agent's authorization to create ad-hoc discounts."},
{id:"Q87",s:1,d:2,ty:"single",q:"Your MCP tool returns error messages as ordinary successful text responses - when a document parsing fails, the tool returns 'Error: could not parse document' as its result text without setting any error flag. The agent then treats that error message as the document's actual content and attempts to 'extract' structured data from the sentence, producing vendor_name: 'Error' and amount: 'could not'. What is the correct MCP error pattern?",o:[{l:"A",t:"Prefix all error messages with 'SYSTEM ERROR:' so the agent recognizes them through text conventions"},{l:"B",t:"Return the failure response with the MCP isError flag set, so the agent programmatically recognizes it as a tool failure rather than interpreting error text as document content"},{l:"C",t:"Return an empty string on failure so there's nothing to misinterpret"},{l:"D",t:"Throw an unhandled exception and let the MCP connection drop, forcing a reconnection"}],a:["B"],r:"The MCP isError flag is the designed channel for communicating tool failures. When set, the agent treats the response as an error condition and can reason about recovery. Without it, error text is structurally indistinguishable from legitimate document content.",w:"A relies on text conventions the model may not interpret correctly; C is a silent failure that hides the problem; D causes a transport-level breakdown when a graceful error signal exists."},
{id:"Q88",s:6,d:4,ty:"single",q:"Your extraction system processes a batch of 10,000 invoices overnight. The batch completes with 200 failures - investigation shows most are oversized documents that exceeded context limits, plus some transient API timeouts. How do you handle the failures without reprocessing the 9,800 successful extractions?",o:[{l:"A",t:"Resubmit the entire 10,000-document batch and keep whichever set of results arrives first"},{l:"B",t:"Accept the 200 failures as a 2% loss rate and proceed with the 9,800 successes"},{l:"C",t:"Identify the 200 failed requests by their custom_id fields, fix the underlying causes (chunk oversized documents into smaller segments, retry transient timeouts), and resubmit only the fixed subset"},{l:"D",t:"Switch the 200 failures to the synchronous API, which doesn't have context limits"}],a:["C"],r:"custom_id fields exist precisely for this: correlating each request with its response, identifying failures by their specific cause, fixing each cause appropriately (chunking for oversized, retrying for transient), and resubmitting only the corrected subset.",w:"A reprocesses 9,800 successes; B silently drops 2% of the corpus; D misunderstands that context limits apply to the model regardless of which API mode is used."},
{id:"Q89",s:6,d:4,ty:"single",q:"Your extraction tool produces valid JSON via tool_use, but quality review reveals that on 8% of invoices, the line item amounts don't sum to the stated total, and vendor names occasionally appear in the address field. The engineering team expected tool_use to prevent all errors. What is the correct understanding?",o:[{l:"A",t:"Tool use was falsely advertised - it should prevent semantic errors too"},{l:"B",t:"Schema compliance guarantees syntactic validity (correct JSON structure and types) but not semantic correctness (values making logical sense). Add semantic validation - extract calculated_total alongside stated_total, flag discrepancies with a conflict_detected boolean, and cross-validate field placements"},{l:"C",t:"Make every field an unconstrained string type so nothing can be structurally wrong"},{l:"D",t:"Re-run each extraction multiple times until the numbers happen to sum correctly"}],a:["B"],r:"Tool use draws a clear boundary: it guarantees structure (valid JSON, correct types, required fields present) but not truth (values being logically correct). Semantic validation - cross-checks, calculated totals, field consistency flags - is a necessary additional layer.",w:"A misunderstands what tool_use guarantees; C destroys the structural benefits; D retries until errors coincidentally align."},
{id:"Q90",s:6,d:4,ty:"single",q:"You want to guarantee that every API request produces a structured extraction and never a conversational text response. You have three extraction tools (one per document type). Incoming documents have unknown types, and the model should choose the correct tool. What tool_choice setting achieves this?",o:[{l:"A",t:"tool_choice: 'auto' - the model decides whether to call a tool or respond with text"},{l:"B",t:"tool_choice: 'any' - the model must call one of the available tools (guaranteeing structured output) but can choose which extraction tool fits the document"},{l:"C",t:"Force one specific extraction tool for all documents regardless of type"},{l:"D",t:"Omit tool_choice and add 'always use a tool' to the system prompt"}],a:["B"],r:"'any' compels a tool call while preserving the model's choice among available tools - exactly right for unknown document types that must always yield structured output. 'auto' and omitting tool_choice both allow conversational text responses that break the pipeline.",w:"A and D permit text responses; C forces one schema on all document types regardless of fit."},
{id:"Q91",s:6,d:5,ty:"single",q:"Your extraction system reports 97% accuracy, and leadership wants to eliminate human review for high-confidence extractions. Before making this decision, you implement stratified random sampling of the 'high-confidence' population. The sampling reveals that while common invoice types are at 99% accuracy, handwritten invoices are at 62% and international invoices are at 71%. What does this demonstrate?",o:[{l:"A",t:"The 97% aggregate is accurate and sufficient for the automation decision"},{l:"B",t:"That aggregate accuracy metrics can mask dramatically different performance across document segments - the 97% was masking near-failure on handwritten and international documents, which would have been fully automated without segment-level validation"},{l:"C",t:"Handwritten and international invoices should be excluded from the system entirely"},{l:"D",t:"The model needs retraining on handwritten documents before any automation decision"}],a:["B"],r:"This is exactly why segment-level validation must precede automation decisions: the 97% aggregate was hiding 62% accuracy on handwritten invoices. Automating 'high-confidence' extractions without segment validation would have silently produced incorrect results for specific document types.",w:"A ignores the variance the sampling revealed; C excludes documents instead of routing them to review; D jumps to retraining when routing to human review handles the immediate risk."},
{id:"Q92",s:6,d:5,ty:"single",q:"Your extraction system's human reviewers can only review 10% of all extractions due to capacity constraints. Currently, reviews are assigned by submission order (every 10th extraction). Error rates vary dramatically: low-confidence extractions have 15% error rates while high-confidence ones have 0.5%. How should review routing be redesigned?",o:[{l:"A",t:"Continue reviewing every 10th extraction for a representative sample"},{l:"B",t:"Have the model output field-level confidence scores, calibrate review thresholds against a labeled validation set, then route low-confidence and ambiguous-source extractions to human review - concentrating limited reviewer capacity where errors actually cluster"},{l:"C",t:"Review only documents longer than 10 pages, since longer documents have more potential for errors"},{l:"D",t:"Trust the model's raw confidence scores without calibration and route anything below 80% confidence to review"}],a:["B"],r:"Calibrated confidence-based routing concentrates limited review capacity where errors actually occur. Field-level scores (not document-level) catch specific problematic fields, and calibration against labeled data ensures the thresholds are meaningful - unlike raw, uncalibrated confidence scores.",w:"A routes by submission order, not error risk; C uses page count as a proxy for error likelihood; D uses uncalibrated confidence that may not correlate with actual accuracy."},
{id:"Q93",s:4,d:3,ty:"single",q:"You are about to restructure a monolithic application into microservices, touching dozens of files with decisions about service boundaries, API contracts, and data ownership. A colleague suggests using direct execution to 'move fast.' Why is this the wrong approach, and what should you use instead?",o:[{l:"A",t:"Direct execution is fine for any task if you provide detailed enough instructions upfront"},{l:"B",t:"Plan mode should be used - it enables safe exploration of the codebase, evaluation of competing service boundary strategies, and stakeholder review of the proposed architecture before committing changes that would be costly to reverse"},{l:"C",t:"Neither - use a separate architecture tool outside Claude Code for the design phase"},{l:"D",t:"Direct execution with frequent git commits so you can revert if needed"}],a:["B"],r:"Plan mode is designed for exactly this class of task: large-scale changes with multiple valid approaches, architectural implications, and high cost of reversal. It enables exploration and design before commitment, preventing costly rework that 'move fast' direct execution would cause.",w:"A underestimates architectural complexity; C unnecessarily moves outside the tool; D uses git as a safety net instead of designing before committing."},
{id:"Q94",s:4,d:5,ty:"single",q:"During a complex investigation spanning multiple sessions, your agent needs crash recovery capability. If the agent process dies mid-analysis (due to a network timeout or system restart), all findings from the current session are lost. How should you design for resilient state persistence?",o:[{l:"A",t:"Re-run the entire analysis from scratch after each crash"},{l:"B",t:"Have the agent periodically export its findings and analysis state to a structured manifest file at a known location. On restart, the coordinator loads the manifest, identifies completed work, and resumes only the unfinished analysis"},{l:"C",t:"Rely on the conversation history persisting across process restarts"},{l:"D",t:"Keep all state in memory and accept that crashes lose progress"}],a:["B"],r:"Structured state persistence via manifest files makes the investigation resilient to crashes. The agent writes findings and status as it goes; after a restart, the manifest shows exactly what's done and what remains, enabling intelligent resumption rather than wasteful restart.",w:"A wastes all completed work; C assumes persistence that doesn't survive process death; D accepts avoidable data loss."},
{id:"Q95",s:4,d:5,ty:"single",q:"Your agent is exploring a large codebase and has accumulated extensive findings about the authentication module over the past hour. You notice its responses becoming increasingly vague - referencing 'the auth system' instead of the specific AuthMiddleware class and JWT validation methods it discovered earlier. The context window is filling with verbose Grep outputs. Which TWO practices help sustain coherent exploration?",o:[{l:"A",t:"Switch to a model with a larger context window and continue"},{l:"B",t:"Have the agent maintain a scratchpad file recording key findings (class names, method signatures, architectural decisions) that it references for subsequent questions"},{l:"C",t:"Delegate verbose discovery (e.g., 'find all middleware files', 'trace the JWT validation flow') to subagents that return summaries, keeping the main session for high-level coordination"},{l:"D",t:"Ask the agent to 'be more specific' in each response"},{l:"E",t:"Repeat the original question in each message so the model sees it more recently"}],a:["B","C"],r:"The two practices manage what occupies finite context: a scratchpad persists precise findings outside the degrading conversation (AuthMiddleware, not 'the auth system'), and subagent delegation keeps verbose Grep results out of the main context entirely.",w:"A postpones the same degradation; D and E add text without removing noise."},
{id:"Q96",s:1,d:5,ty:"single",q:"Your support agent handles multi-issue sessions where customers raise 3-4 concerns in sequence. During these extended sessions, the agent needs to remember precise details - refund amount $127.43, order #889234, return window expires March 15 - from the first issue while working on the fourth. Currently, progressive summarization is condensing these into vague references like 'the customer's refund.' How do you preserve transactional precision?",o:[{l:"A",t:"Increase the context window size so summarization isn't needed"},{l:"B",t:"Extract transactional facts (amounts, order numbers, dates, statuses) into a persistent 'case facts' block included in every prompt, separate from the summarized conversation history"},{l:"C",t:"Ask the customer to repeat key details before each new issue"},{l:"D",t:"Disable summarization entirely and keep the full conversation history"}],a:["B"],r:"A dedicated 'case facts' block persists precise transactional data outside the conversation that gets summarized. The summary can safely condense discussion flow while the case facts block preserves every dollar amount, order number, and date exactly as stated.",w:"A is expensive and doesn't prevent summarization; C outsources a system problem to the customer; D will eventually hit context limits on long sessions."},
{id:"Q97",s:5,d:4,ty:"single",q:"You are adding few-shot examples to your code review prompt. A colleague suggests including 20+ examples to cover every possible case. Another suggests just 2-3 targeted examples. Which approach is more effective, and what should the examples demonstrate?",o:[{l:"A",t:"Include 20+ examples - more examples always improve quality"},{l:"B",t:"Use 2-4 targeted examples aimed at the genuinely ambiguous scenarios (where the right action isn't obvious), showing the reasoning for why one action was chosen over plausible alternatives, plus examples demonstrating the exact desired output format (location, issue, severity, fix)"},{l:"C",t:"Once you add examples, you can remove all explicit review criteria since the examples replace them"},{l:"D",t:"Examples only work for prose generation tasks, not for code review"}],a:["B"],r:"Effective few-shot prompting is targeted, not exhaustive: a handful of examples aimed at genuine ambiguity with explicit reasoning, plus format demonstrations that lock output structure. 20+ examples bloat context and dilute the signal of the examples that matter.",w:"A wastes context on unambiguous cases; C is false - examples complement criteria, not replace them; D is false - code review is a prime few-shot use case."},
{id:"Q98",s:2,d:3,ty:"single",q:"Your team wants multiple interacting bug fixes addressed in one Claude Code session. Three bugs interact: a race condition in the event queue causes a null pointer in the handler, which triggers an incorrect error message to the user. A fourth bug (a typo in a config file) is completely independent. How should these be addressed?",o:[{l:"A",t:"Fix all four bugs one at a time in four separate sequential messages"},{l:"B",t:"Provide all four bugs in a single message with equal detail"},{l:"C",t:"Address the three interacting bugs together in one detailed message (since their fixes interact), and the independent typo fix separately - interacting issues benefit from consolidated context while independent issues can be fixed sequentially"},{l:"D",t:"Let Claude decide which order to fix them based on its assessment of priority"}],a:["C"],r:"When fixes interact (the race condition, null pointer, and error message are causally linked), addressing them together gives Claude the full picture of how changes propagate. Independent issues (the config typo) don't benefit from this shared context and can be handled separately.",w:"A loses the interaction context between related bugs; B mixes unrelated issues with interacting ones; D delegates sequencing without providing the interaction information."},
{id:"Q99",s:3,d:1,ty:"single",q:"Your coordinator needs to partition a broad research topic across subagents to minimize duplication. It assigns 'renewable energy policy in Europe' to one subagent and 'electric vehicle adoption in Europe' to another. However, findings about EV subsidies (which are both energy policy and EV adoption) are missed entirely because neither subagent claims the intersection. How should scope assignment be improved?",o:[{l:"A",t:"Assign each subagent even narrower, strictly non-overlapping scopes to prevent any confusion"},{l:"B",t:"Let each subagent research the full topic independently and deduplicate at the end"},{l:"C",t:"Assign deliberate scope overlap at known intersection points, then have the synthesis step deduplicate - it's better to cover an intersection twice than zero times"},{l:"D",t:"Add a third subagent specifically for intersection topics"}],a:["C"],r:"Some controlled overlap between subagent scopes ensures intersections are covered. The synthesis step can deduplicate overlapping findings, but it cannot recover topics that no subagent investigated. Missing an intersection is worse than covering it twice.",w:"A makes the gap worse with stricter boundaries; B fully duplicates all work; D creates a fragile architecture where intersection detection becomes its own complex problem."},
{id:"Q100",s:3,d:5,ty:"single",q:"Your web search subagent encounters a timeout while researching a complex topic. The subagent needs to report this failure to the coordinator for intelligent recovery. Which error propagation approach gives the coordinator the best information to decide what to do next?",o:[{l:"A",t:"Return an empty result set marked as successful - keeping the pipeline moving is more important than reporting a failure"},{l:"B",t:"Terminate the entire research workflow since any subagent failure means the research is incomplete"},{l:"C",t:"Return a generic 'search unavailable' status regardless of what went wrong"},{l:"D",t:"Return structured error context to the coordinator: failure type (timeout), the query that was attempted, any partial results obtained before the timeout, and potential alternative approaches - enabling intelligent recovery decisions"}],a:["D"],r:"Structured error context gives the coordinator everything it needs for intelligent recovery: retry with a modified query, try an alternative source, proceed with partial results, or escalate. Generic statuses and silent suppression both hide the information recovery decisions require.",w:"A silently suppresses the failure, risking incomplete research presented as complete; B is disproportionate when partial recovery is possible; C hides the specific context the coordinator needs."}];

async function seedDB(){if(!hasSupa()||!st.adminKey){alert('Set your Supabase service role key first.');return;}
  const total=BQ.length;let done=0;let errors=0;
  const status=document.getElementById('seed-status');
  if(status)status.textContent='Seeding 0/'+total+'...';
  // Seed scenarios first
  const scenarios=Object.entries(BS);
  for(const[num,s]of scenarios){
    try{await fetch(SUPABASE_URL+'/rest/v1/scenarios',{method:'POST',headers:{'apikey':st.adminKey,'Authorization':'Bearer '+st.adminKey,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({scenario_num:Number(num),title:s.t||s.title,description:s.d||s.desc||'',is_builtin:true})});}catch(e){}}
  // Seed questions
  for(const q of BQ){
    try{const body={question_id:q.id,scenario_num:q.s,domain:q.d,question_type:q.ty||'single',select_count:q.se||1,question_text:q.q,options:q.o,correct_answers:q.a,rationale:q.r||'',why_not:q.w||'',ref_url:REFS[q.id]||'',is_builtin:true};
      const r=await fetch(SUPABASE_URL+'/rest/v1/questions',{method:'POST',headers:{'apikey':st.adminKey,'Authorization':'Bearer '+st.adminKey,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});
      if(!r.ok){const t=await r.text();console.warn('Seed '+q.id+':',t);errors++;}
      done++;if(status)status.textContent='Seeding '+done+'/'+total+(errors?' ('+errors+' errors)':'')+'...';}catch(e){errors++;done++;}}
  if(status)status.textContent=done+' questions seeded'+(errors?' ('+errors+' errors)':' successfully')+'!';
  console.log('Seed complete:',done,'done,',errors,'errors');
  setTimeout(()=>{location.reload();},1500);}function allS(){return{...BS,...CS};}

function selectPracticeQuestions(){const pool=allQ();const selected=[];const byD={};pool.forEach(q=>{if(!byD[q.domain])byD[q.domain]=[];byD[q.domain].push(q);});Object.entries(WEIGHTS).forEach(([d,count])=>{const avail=byD[d]||[];const sh=[...avail].sort(()=>Math.random()-.5);selected.push(...sh.slice(0,count));});return selected.sort(()=>Math.random()-.5);}

function calcScore(questions){let c=0,at=0;const ds={};Object.keys(DM).forEach(d=>ds[d]={c:0,t:0,a:0});questions.forEach(q=>{if(ds[q.domain])ds[q.domain].t++;if(st.sub[q.id]){at++;if(ds[q.domain])ds[q.domain].a++;const s=(st.sel[q.id]||[]).slice().sort().join(',');if(s===q.answer.slice().sort().join(',')){c++;if(ds[q.domain])ds[q.domain].c++;}}});return{c,at,tot:questions.length,ds};}
function E(tag,a,...ch){const e=document.createElement(tag);if(a)Object.entries(a).forEach(([k,v])=>{if(k==='className')e.className=v;else if(k==='innerHTML')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else e.setAttribute(k,v);});ch.flat().forEach(c=>{if(typeof c==='string')e.appendChild(document.createTextNode(c));else if(c)e.appendChild(c);});return e;}

// CSV helpers
function parseCSV(text){const rows=[];let row=[];let cell='';let inQ=false;for(let i=0;i<text.length;i++){const c=text[i];if(inQ){if(c==='"'){if(i+1<text.length&&text[i+1]==='"'){cell+='"';i++;}else inQ=false;}else cell+=c;}else{if(c==='"')inQ=true;else if(c===','){row.push(cell.trim());cell='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&i+1<text.length&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(c=>c))rows.push(row);row=[];cell='';}else cell+=c;}}row.push(cell.trim());if(row.some(c=>c))rows.push(row);return rows;}
function generateTemplate(){const h=['scenario_number','scenario_title','scenario_description','domain','type','select_count','question','option_a','option_b','option_c','option_d','option_e','correct_answers','rationale','why_not'];const e1=['1','','','1','single','','What signal drives the agentic loop?','Parsing NL text','Checking stop_reason','Counting iterations','Token threshold','','B','stop_reason is the designed signal.','A is unreliable.'];const q=v=>v.includes(',')||v.includes('"')||v.includes('\n')?'"'+v.replace(/"/g,'""')+'"':v;return[h,e1].map(r=>r.map(q).join(',')).join('\n');}
function downloadTemplate(){const b=new Blob([generateTemplate()],{type:'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='ccar-f-question-template.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);}
function parseUploadRows(rows){if(rows.length<2)return{questions:[],errors:['No data rows.']};const hdr=rows[0].map(h=>h.toLowerCase().replace(/\s+/g,'_'));const col=n=>hdr.indexOf(n);const iSN=col('scenario_number'),iST=col('scenario_title'),iSD=col('scenario_description'),iDM=col('domain'),iTY=col('type'),iSE=col('select_count'),iQ=col('question'),iA=col('option_a'),iB=col('option_b'),iC=col('option_c'),iD=col('option_d'),iE=col('option_e'),iCA=col('correct_answers'),iR=col('rationale'),iWN=col('why_not');if(iQ<0||iCA<0||iSN<0||iDM<0)return{questions:[],errors:['Missing required columns.']};const questions=[];const errors=[];for(let i=1;i<rows.length;i++){const r=rows[i];if(!r[iQ])continue;const rn=i+1;const sn=parseInt(r[iSN]);if(!sn){errors.push('Row '+rn+': bad scenario_number');continue;}const dm=parseInt(r[iDM]);if(!dm||dm<1||dm>5){errors.push('Row '+rn+': domain must be 1-5');continue;}const ty=(r[iTY]||'single').toLowerCase();const se=parseInt(r[iSE])||2;const labs='ABCDE';const optCols=[iA,iB,iC,iD,iE];const opts=[];optCols.forEach((ci,j)=>{if(ci>=0&&r[ci])opts.push({l:labs[j],t:r[ci]});});if(opts.length<2){errors.push('Row '+rn+': need 2+ options');continue;}const ans=(r[iCA]||'').split(',').map(a=>a.trim().toUpperCase()).filter(a=>a);if(!ans.length){errors.push('Row '+rn+': no answers');continue;}questions.push({sn,st:r[iST]||'',sd:r[iSD]||'',dm,ty,se,q:r[iQ],opts,ans,rat:r[iR]||'',wn:r[iWN]||''});}return{questions,errors};}

// Shared question card renderer
function renderQCard(q,opts){
  var showAns=opts.showAnswer===true;var allowSel=opts.allowSelect!==false;var showAdmin=opts.showAdmin;
  var card=E('div',{className:'qc'+(q.custom?' cust':'')});var d=DM[q.domain];var tl=q.type==='multi'?'Select '+(q.select||2):'Select one';
  var qh=E('div',{className:'qh'},E('span',{className:'qn'},q.id),E('span',{className:'badge b'+d.c},'D'+q.domain),E('span',{className:'badge b-type'},tl));
  if(q.custom&&showAdmin){qh.appendChild(E('span',{className:'badge b-custom'},'Custom'));var rt=E('div',{className:'qhr'});rt.appendChild(E('button',{className:'btn btn-g btn-sm',innerHTML:IC.edit,onClick:()=>{st.modal={t:'eq',q};render();}}));rt.appendChild(E('button',{className:'btn btn-g btn-sm',innerHTML:IC.trash,style:{color:'var(--danger)'},onClick:()=>{if(confirm('Delete?')){CQ=CQ.filter(c=>c.id!==q.id);saveData();render();}}}));qh.appendChild(rt);}
  if(opts.flaggable){var isFl=st.pflag[q.id];qh.appendChild(E('button',{className:'btn btn-g btn-sm',innerHTML:IC.flag,style:isFl?{color:'#C0522A'}:{},onClick:()=>{st.pflag[q.id]=!st.pflag[q.id];render();}}));}
  card.appendChild(qh);

  // Two independent states, deliberately kept apart:
  //   graded (st.sub)  - set ONLY by Submit. Permanent: it is the user's
  //                      result, counts in calcScore, and survives Hide.
  //   revealed (st.rev)- set by Show Answer. A peek, not an attempt. It is
  //                      fully undone by Hide and never reaches calcScore.
  // Keyed strictly by this card's own q.id, so one card can never affect
  // another. Merging these two was what made Hide leave the correct answer
  // highlighted and made peeking silently score a question as wrong.
  var graded=st.sub[q.id]===true;
  var revealed=showAns||(!!q.id&&st.rev[q.id]===true);
  var locked=graded||revealed;

  var body=E('div',{className:'qb'},E('p',null,q.question));
  var ol=E('ul',{className:'opts'});
  q.options.forEach(function(opt){var sel=st.sel[q.id]||[];var isSel=sel.includes(opt.l);var isCor=q.answer.includes(opt.l);
    var cls='';
    if(graded&&isCor)cls=' ok';else if(graded&&isSel&&!isCor)cls=' wrong';
    else if(revealed&&isCor)cls=' ok'+(isSel?' sel':'');
