<!DOCTYPE html>

<title>CCAR-F Practice Exam</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--bg:#f5f7fa;--surface:#fff;--border:#dce1e8;--border-focus:#1B4F8A;--text:#2C3E50;--text-2:#4a5568;--text-m:#8b90a0;--ac:#1B4F8A;--ac-l:#D6EAF8;--ac-h:#1A2E45;--ac-s:#EEF5FB;--d1:#0097A7;--d1b:#E8F6F8;--d2:#2E86C1;--d2b:#D6EAF8;--d3:#5B38B6;--d3b:#F0EBF9;--d4:#C0522A;--d4b:#FDF0EB;--d5:#1B4F8A;--d5b:#EEF5FB;--ok-bg:#ecfdf5;--ok-bd:#6ee7b7;--ok-tx:#065f46;--err-bg:#FDF0EB;--err-bd:#e8a88a;--err-tx:#8B2500;--danger:#C0522A;--sh:0 1px 3px rgba(26,46,69,.06);--sh-m:0 4px 14px rgba(26,46,69,.1);--sh-l:0 12px 40px rgba(26,46,69,.18);--r:10px;--rl:14px}

body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.hdr{background:linear-gradient(135deg,#1B4F8A,#1A2E45);color:#fff;padding:2rem 1.5rem 1.5rem;text-align:center;box-shadow:0 4px 20px rgba(27,79,138,.35)}
.hdr h1{font-size:1.5rem;font-weight:800;letter-spacing:-.03em}.hdr .sub{font-size:.8rem;opacity:.75;margin-top:.15rem}
.hdr-actions{display:flex;justify-content:center;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.btn-h{font-family:inherit;font-size:.78rem;font-weight:600;padding:.45rem 1rem;border-radius:8px;cursor:pointer;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;transition:all .15s;display:flex;align-items:center;gap:.35rem}
.btn-h:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}.btn-h svg{width:15px;height:15px}

@media(max-width:500px){.mode-sel{grid-template-columns:1fr}}
.mode-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--rl);padding:1.75rem 1.25rem;text-align:center;cursor:pointer;transition:all .2s;box-shadow:var(--sh)}

.mode-card svg{width:40px;height:40px;color:var(--ac);margin-bottom:.75rem}
.mode-card h2{font-size:1.05rem;font-weight:700;margin-bottom:.35rem}

.mode-card .tag{display:inline-block;font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:20px;margin-top:.6rem;background:var(--ac-l);color:var(--ac-h)}

.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ac-h)}
.btn-g{background:transparent;color:var(--text-2);border:1px solid var(--border)}.btn-g:hover{background:var(--bg)}
.btn-d{background:transparent;color:var(--danger);border:1px solid var(--err-bd)}.btn-d:hover{background:var(--err-bg)}
.btn-sm{font-size:.72rem;padding:.3rem .6rem}.btn svg{width:13px;height:13px;pointer-events:none}
.badge{font-size:.65rem;font-weight:600;padding:.12rem .45rem;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.bd1{background:var(--d1b);color:var(--d1)}.bd2{background:var(--d2b);color:var(--d2)}.bd3{background:var(--d3b);color:var(--d3)}.bd4{background:var(--d4b);color:var(--d4)}.bd5{background:var(--d5b);color:var(--d5)}
.b-type{background:var(--bg);color:var(--text-2)}.b-custom{background:#F0EBF9;color:#5B38B6}
.nav{display:flex;gap:.2rem;padding:.65rem .75rem;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch}.nav::-webkit-scrollbar{display:none}

.prog{display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;background:var(--surface);border-bottom:1px solid var(--border)}

.qh{display:flex;align-items:center;gap:.4rem;padding:.6rem .85rem;border-bottom:1px solid var(--border);flex-wrap:wrap}

.qhr{margin-left:auto;display:flex;gap:.25rem}
.qb{padding:.85rem}.qb>p{font-size:.85rem;line-height:1.6;margin-bottom:.6rem}
.opts{list-style:none}.opts li{padding:.5rem .7rem;margin-bottom:.3rem;border-radius:7px;font-size:.82rem;line-height:1.45;background:var(--bg);border:1px solid transparent;transition:all .12s;cursor:pointer}
.opts li:hover{border-color:var(--border);background:#eef0f4}.opts li.sel{border-color:var(--ac);background:var(--ac-l);font-weight:500}
.opts li.ok{border-color:var(--ok-bd);background:var(--ok-bg)}.opts li.wrong{border-color:var(--err-bd);background:var(--err-bg)}.opts li.disabled{cursor:default;opacity:.85}
.ol{font-family:'JetBrains Mono',monospace;font-weight:600;margin-right:.35rem;font-size:.78rem}
.qa{padding:.6rem .85rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.4rem;flex-wrap:wrap}
.ans-b{padding:.85rem;margin:0 .85rem .85rem;border-radius:8px;background:var(--ok-bg);border:1px solid var(--ok-bd)}
.ans-b .al{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ok-tx);margin-bottom:.3rem}
.ans-b .av{font-size:.88rem;font-weight:700;color:var(--ok-tx);margin-bottom:.5rem}
.ans-b .rat{font-size:.8rem;color:#1a3a2a;line-height:1.55}
.ans-b .wn{margin-top:.5rem;padding-top:.5rem;border-top:1px solid rgba(6,95,70,.12);font-size:.75rem;color:#3a6a50;line-height:1.5;font-style:italic}
.ans-b .ref-link{margin-top:.5rem;padding-top:.5rem;border-top:1px solid rgba(6,95,70,.12)}
.ans-b .ref-link a{font-size:.75rem;color:var(--ac);text-decoration:none;font-weight:600}
.ans-b .ref-link a:hover{text-decoration:underline}
.score-s{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin:.5rem 0;box-shadow:var(--sh)}.score-s h3{font-size:.9rem;margin-bottom:.6rem}
.ds{display:grid;gap:.4rem}.dsr{display:flex;align-items:center;gap:.4rem;font-size:.75rem}
.dsr .dn{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsr .db{width:80px;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}.dsr .dbf{height:100%;border-radius:3px;transition:width .5s}
.dsr .dp{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:.72rem;width:2.5rem;text-align:right}
.timer-bar{display:flex;align-items:center;justify-content:center;gap:.75rem;padding:.5rem 1rem;background:var(--surface);border-bottom:1px solid var(--border);font-size:.82rem}

.timer.warn{color:#C0522A;animation:pulse 1s ease infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.timer-bar .qi{font-weight:600;color:var(--text-2)}

.qnum-dot:hover{border-color:var(--ac)}.qnum-dot.cur{border-color:var(--ac);background:var(--ac);color:#fff}
.qnum-dot.ans{background:var(--ac-l);border-color:var(--ac);color:var(--ac-h)}.qnum-dot.flagged{background:#FDF0EB;border-color:#C0522A}
.report{max-width:600px;margin:1.5rem auto;padding:1.5rem;background:var(--surface);border-radius:var(--rl);border:1px solid var(--border);box-shadow:var(--sh-m);text-align:center}
.report .big-score{font-size:3rem;font-weight:800;margin:.5rem 0}
.report .big-score.pass{color:var(--ac)}.report .big-score.fail{color:var(--danger)}.report .big-score.border{color:#C0522A}
.report .verdict{font-size:1.1rem;font-weight:700;margin-bottom:1rem;padding:.5rem 1rem;border-radius:8px;display:inline-block}
.verdict.pass{background:var(--ok-bg);color:var(--ok-tx)}.verdict.fail{background:var(--err-bg);color:var(--err-tx)}.verdict.border{background:#FDF0EB;color:#C0522A}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--rl);box-shadow:var(--sh-l);width:100%;max-width:640px;animation:mIn .2s ease}

.modal-hd{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.modal-hd h2{font-size:1rem;font-weight:700}
.modal-x{background:none;border:none;cursor:pointer;color:var(--text-2);padding:.3rem;border-radius:6px;display:flex}.modal-x:hover{background:var(--bg)}.modal-x svg{width:18px;height:18px}
.modal-bd{padding:1.25rem;max-height:70vh;overflow-y:auto}.modal-ft{padding:.85rem 1.25rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.5rem}
.fg{margin-bottom:1rem}.fg label{display:block;font-size:.78rem;font-weight:600;margin-bottom:.3rem;color:var(--text-2)}.fg .hint{font-size:.7rem;color:var(--text-m);margin-top:.2rem}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}@media(max-width:500px){.fr{grid-template-columns:1fr}}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;font-family:inherit;font-size:.85rem;padding:.5rem .7rem;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);transition:border-color .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--border-focus);background:var(--ac-s)}textarea{resize:vertical;min-height:70px;line-height:1.5}
.oir{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.oir .orl{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:.82rem;width:1.5rem;text-align:center;color:var(--ac);flex-shrink:0}
.oir input[type=text]{flex:1}.oir .oc{display:flex;align-items:center;gap:.2rem;font-size:.7rem;color:var(--text-m);cursor:pointer;flex-shrink:0;user-select:none}
.oir .oc input[type=checkbox]{width:auto;margin:0;cursor:pointer;accent-color:var(--ac)}
.rb{background:none;border:none;cursor:pointer;color:var(--text-m);padding:.2rem;border-radius:4px;display:flex;flex-shrink:0}.rb:hover{color:var(--danger);background:var(--err-bg)}.rb svg{width:14px;height:14px}
.add-opt{font-family:inherit;font-size:.75rem;color:var(--ac);background:none;border:1px dashed var(--border);border-radius:7px;padding:.35rem .7rem;cursor:pointer;margin-top:.3rem}.add-opt:hover{border-color:var(--ac);background:var(--ac-s)}
.dz{border:2px dashed var(--border);border-radius:var(--r);padding:2rem 1rem;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg)}
.dz:hover,.dz.dov{border-color:var(--ac);background:var(--ac-s)}.dz svg{width:36px;height:36px;color:var(--text-m);margin-bottom:.5rem}
.dz p{font-size:.82rem;color:var(--text-2)}.dz input[type=file]{display:none}
.u-st{padding:.6rem .85rem;border-radius:8px;font-size:.8rem;margin-top:.75rem;display:flex;align-items:center;gap:.4rem}
.u-st.ok{background:var(--ok-bg);color:var(--ok-tx);border:1px solid var(--ok-bd)}
.u-st.err{background:var(--err-bg);color:var(--err-tx);border:1px solid var(--err-bd)}
.u-st.info{background:#eff6ff;color:#1e40af;border:1px solid #93c5fd}
.ptbl{width:100%;border-collapse:collapse;font-size:.75rem;margin-top:.75rem}
.ptbl th{background:var(--bg);padding:.4rem .5rem;text-align:left;font-weight:600;color:var(--text-2);border-bottom:2px solid var(--border);position:sticky;top:0}
.ptbl td{padding:.35rem .5rem;border-bottom:1px solid var(--border);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ptbl tr:hover td{background:var(--ac-s)}
.pw{max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px}
.ta{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:2rem 1rem;color:var(--text-m);font-size:.85rem}
.foot{text-align:center;padding:1.5rem 1rem;font-size:.72rem;color:var(--text-m)}.foot a{color:#2E86C1;text-decoration:none}
@media(max-width:600px){.hdr{padding:1.25rem .75rem 1rem}.hdr h1{font-size:1.15rem}.container{padding:.4rem}.modal-bd{padding:.85rem}}

<body>
<div id="app"></div>
<script>
const BQ=[{id:"Q1",s:1,d:1,ty:"single",q:"You are implementing the core agentic loop for your customer support agent. After sending each request to Claude, your harness code needs to decide whether to execute the tools Claude requested or present Claude's text response to the customer. During testing, you notice the loop sometimes terminates prematurely when Claude provides a status update to the customer mid-conversation while also requesting a tool call in the same response. Which signal should your harness inspect to make the continue-or-stop decision?",o:[{l:"A",t:"Check whether the response contains any text content - if it does, the agent is addressing the customer and the loop should stop"},{l:"B",t:"Inspect the stop_reason field: continue executing tools when it is \"tool_use\" and terminate the loop when it is \"end_turn\""},{l:"C",t:"Count the number of tool calls made so far and stop after a configurable maximum (e.g., 10 iterations)"},{l:"D",t:"Parse the assistant's text for phrases like \"I have resolved\" or \"your issue is complete\" to detect when the agent considers itself done"}],a:["B"],r:"The stop_reason field is the designed, deterministic signal for loop control. \"tool_use\" means Claude wants tools executed; \"end_turn\" means it has finished. Responses can contain both text and tool_use blocks simultaneously, so checking for text content (A) causes premature termination. Parsing natural language (D) is a documented anti-pattern.",w:"A fails because responses legitimately contain text alongside tool calls; C uses an arbitrary cap as the primary mechanism; D relies on unreliable NL parsing."},
{id:"Q2",s:1,d:1,ty:"single",q:"Your support agent calls lookup_order to retrieve order details. Your harness code successfully executes the tool against your backend and receives the order data. A junior developer asks how the model actually sees this data so it can decide what to do next. What is the correct explanation?",o:[{l:"A",t:"The Claude API automatically executes tools registered in the system and incorporates results into the model's context - no additional code is needed"},{l:"B",t:"Your code must append a tool_result block (referencing the original tool call's ID) to the conversation history array, then send the updated messages back to Claude in the next API request"},{l:"C",t:"The MCP server pushes the result directly into the model's working memory via a callback URL"},{l:"D",t:"The model re-reads the tool's description on each turn, and you should update the description to include the latest result"}],a:["B"],r:"The API is stateless - tool execution happens in your code, and results reach the model only by appending them to the conversation history and re-invoking the API. There is no automatic execution, no push mechanism, and tool descriptions are static definitions, not result containers.",w:"A and C describe automatic mechanisms that don't exist; D confuses static definitions with runtime data."},
{id:"Q3",s:1,d:1,ty:"single",q:"Company policy caps autonomous refunds at $500. Refunds above this amount require human approval. During testing with prompt-based enforcement, you discover that in approximately 3% of cases the agent still processes refunds of $600-$800, particularly when the customer provides a compelling hardship story. The compliance team requires zero tolerance for policy violations with financial consequences. What is the correct enforcement design?",o:[{l:"A",t:"Move the $500 limit to the very top of the system prompt in bold, and repeat it as the last instruction - position emphasis will ensure compliance"},{l:"B",t:"Implement a tool-call interception hook that programmatically checks the amount parameter on every process_refund call, blocks any amount above $500, and redirects the agent to the escalate_to_human workflow"},{l:"C",t:"Add the $500 limit to the process_refund tool's description with the note \"CRITICAL: never exceed $500\" so the model reads it during tool selection"},{l:"D",t:"Lower the model temperature to 0.0 so the agent follows rules more deterministically"}],a:["B"],r:"Business rules with financial consequences require deterministic, programmatic enforcement. A hook intercepts the tool call before execution, making it impossible for a policy-violating refund to go through regardless of what the model decides. All prompt-based approaches (A, C) remain probabilistic.",w:"A and C improve odds but retain a non-zero failure rate shown in testing; D misapplies a sampling parameter to a compliance problem."},
{id:"Q4",s:1,d:1,ty:"single",q:"A customer writes: \"I need a refund for my damaged headphones from order #8834, I also need to update my shipping address to 123 Oak St, and I'm missing 500 loyalty points from my last purchase.\" Your agent currently handles only the first issue mentioned and waits for the customer to raise the others separately, resulting in multiple contacts for what should be a single interaction. Your target is 80%+ first-contact resolution. How should the agent handle multi-concern messages?",o:[{l:"A",t:"Resolve the most urgent issue (the refund) and send a follow-up message asking if there's anything else - handling one concern well is better than three poorly"},{l:"B",t:"Decompose the message into three distinct items, investigate each using the shared customer context (in parallel where possible), then synthesize one unified response covering all three resolutions"},{l:"C",t:"Escalate immediately - multi-issue messages indicate a frustrated customer who should speak to a human"},{l:"D",t:"Ask the customer to submit each concern as a separate support ticket so they can be tracked independently"}],a:["B"],r:"Multi-concern decomposition directly protects first-contact resolution: the agent splits the request, investigates each item against shared context, and responds once with a complete resolution. This is the designed pattern for handling compound requests.",w:"A silently drops two concerns; C escalates work within the agent's capability; D forces the customer to repeat effort across multiple tickets."},
{id:"Q5",s:1,d:1,ty:"single",q:"Your agent must verify the customer's identity via get_customer before any account operations. Production data shows that in 8% of cases, when customers volunteer an order number upfront (\"check my order #12345\"), the agent skips identity verification and calls lookup_order directly - occasionally leading to misidentified accounts. Prompt instructions stating \"always verify identity first\" have not eliminated this behavior. What change provides a reliable guarantee?",o:[{l:"A",t:"Add few-shot examples to the system prompt showing the agent always calling get_customer first, even when order numbers are provided"},{l:"B",t:"Implement a programmatic prerequisite gate that blocks lookup_order and process_refund calls until get_customer has returned a verified customer ID"},{l:"C",t:"Rename get_customer to verify_identity_REQUIRED to make the tool's importance clearer"},{l:"D",t:"Add a routing classifier that parses user input and pre-selects which tools are available based on detected intent"}],a:["B"],r:"When a specific tool sequence is required for critical business logic, programmatic enforcement (a gate that blocks downstream tools until the prerequisite completes) provides a deterministic guarantee. Prompt-based approaches (A) and naming conventions (C) remain probabilistic.",w:"A is probabilistic and didn't solve the 8% failure rate; C hopes naming will change behavior; D addresses tool availability, not ordering."},
{id:"Q6",s:1,d:1,ty:"single",q:"Your agent needs to normalize data from multiple MCP tools before reasoning about it. The get_customer tool returns timestamps as Unix epoch integers, lookup_order returns them as ISO 8601 strings, and process_refund returns status as numeric codes (1=pending, 2=approved, 3=rejected). Without normalization, the agent sometimes miscompares dates and misinterprets status codes. Which Agent SDK mechanism provides deterministic normalization?",o:[{l:"A",t:"Add a system prompt instruction asking the model to mentally convert all formats before reasoning"},{l:"B",t:"A PostToolUse hook that intercepts each tool's results and transforms timestamps to a uniform format and status codes to readable labels before the model processes them"},{l:"C",t:"Create wrapper tools that call the original tools and normalize output - but this requires maintaining duplicate tool definitions"},{l:"D",t:"Include a format legend in every tool description so the model knows how to interpret each format"}],a:["B"],r:"PostToolUse hooks intercept tool results and can deterministically transform heterogeneous data before the model ever sees it. The model then reasons about clean, consistent data without needing to perform mental format conversion.",w:"A relies on the model's unreliable mental arithmetic; C duplicates tool infrastructure; D informs but doesn't guarantee correct interpretation."},
{id:"Q7",s:1,d:2,ty:"single",q:"Your process_refund tool currently returns the string \"Operation failed\" for every type of failure - whether it's a temporary database timeout, an invalid order number, or a business policy rejection. In production, the agent responds by retrying policy-blocked refunds (which will never succeed) and giving up on temporary outages (which would succeed on retry). What should the error response include to enable correct recovery behavior?",o:[{l:"A",t:"A longer error message with more detail in natural language, like \"The refund could not be processed due to a system issue or policy violation\""},{l:"B",t:"Structured error metadata: an errorCategory (transient/validation/business/permission), an isRetryable boolean, and a human-readable description the agent can relay to the customer"},{l:"C",t:"An HTTP status code (e.g., 503 for timeout, 403 for policy) so the agent can follow standard web conventions"},{l:"D",t:"No error at all - return a success response with a flag indicating partial completion, so the conversation stays positive"}],a:["B"],r:"Structured error metadata gives the agent the information it needs to make appropriate recovery decisions: retry transient errors, explain business rejections to the customer, and stop wasting attempts on non-retryable failures.",w:"A provides more detail but no machine-parseable signal; C uses web conventions the model may not reliably interpret; D suppresses failures, creating misinformation."},
{id:"Q8",s:1,d:2,ty:"single",q:"Production logs show your agent frequently confuses get_customer and lookup_order. Both tools currently have one-line descriptions: \"Retrieves customer information\" and \"Retrieves order details.\" They accept similar identifier formats (both can take an email or a numeric ID). When a customer says \"check my order #12345,\" the agent calls get_customer 40% of the time instead of lookup_order. What is the most effective first step to fix this misrouting?",o:[{l:"A",t:"Consolidate both tools into a single lookup_entity tool that accepts any identifier and internally determines which backend to query"},{l:"B",t:"Add 5-8 few-shot examples to the system prompt demonstrating correct tool selection patterns for various query types"},{l:"C",t:"Expand each tool's description to include input formats it handles, example queries, edge cases, and explicit boundary language explaining when to use it versus the other"},{l:"D",t:"Implement a keyword-based routing layer that pre-selects the tool before the model sees the request"}],a:["C"],r:"Tool descriptions are the primary mechanism LLMs use for tool selection. Expanding them with input formats, example queries, and explicit boundary language (e.g., \"use lookup_order when an order number is present\") directly addresses the root cause of misrouting.",w:"A is a valid architectural choice but more effort than a first step warrants; B adds token overhead without fixing descriptions; D bypasses the model's natural language understanding."},
{id:"Q9",s:1,d:1,ty:"single",q:"The agent must escalate a complex billing dispute involving a partial refund, a shipping credit, and a loyalty point adjustment. The human agents receiving escalations do not have access to the AI agent's conversation transcript or tool call history. Currently, escalations include only the customer's name and a one-line summary like \"billing dispute - needs help.\" Human agents report spending 10+ minutes re-investigating cases the AI agent already analyzed. What should the escalation handoff include?",o:[{l:"A",t:"The raw JSON of every tool result gathered during the session, so the human has complete data"},{l:"B",t:"A structured handoff summary: customer ID, verified account details, the root cause analysis completed so far, relevant amounts and order numbers, actions already taken, and a recommended next step"},{l:"C",t:"A sentiment score (1-10) indicating how frustrated the customer is, so the human can prioritize accordingly"},{l:"D",t:"Only the customer's name and account number - human agents prefer to start their own investigation without bias from the AI's analysis"}],a:["B"],r:"Structured handoff protocols exist precisely because the receiving human lacks the transcript. The summary transfers the complete case state - identity, findings, figures, actions taken, and a recommendation - so the customer never has to repeat information and the human doesn't re-investigate.",w:"A dumps unprocessed noise requiring the human to parse JSON; C conveys mood not case state; D forces the human to redo work the AI already completed."},
{id:"Q10",s:1,d:5,ty:"single",q:"A customer's opening message is: \"I want to speak to a human agent immediately. Do not try to help me yourself.\" Your agent has access to the customer's account and can see that the issue appears to be a straightforward product replacement - a case the agent resolves correctly 95% of the time. The engineering team suggests the agent should attempt resolution first since it would be faster for the customer. What should the agent do?",o:[{l:"A",t:"Attempt resolution first, since the issue is simple - escalate only if the automated attempt fails or the customer asks again"},{l:"B",t:"Run sentiment analysis to quantify the customer's frustration level and escalate only if it exceeds a configurable threshold"},{l:"C",t:"Escalate immediately - an explicit customer request for a human is an absolute escalation trigger that must be honored without first attempting investigation"},{l:"D",t:"Acknowledge the request but ask three clarifying questions to determine if the customer might accept automated help after understanding the agent's capabilities"}],a:["C"],r:"Explicit customer demands for a human agent are a first-class escalation trigger, honored immediately and unconditionally. Overriding a clearly stated preference to demonstrate capability damages trust regardless of how resolvable the issue appears.",w:"A and D do exactly what the customer explicitly prohibited; B substitutes a computed proxy for a signal that couldn't be clearer."},
{id:"Q11",s:1,d:5,ty:"single",q:"Your team proposes automatically escalating support cases to human agents whenever the agent's sentiment analysis detects negative customer sentiment above a configurable threshold. The rationale is that frustrated customers deserve human attention. During a pilot, you notice a calm, polite customer with a complex policy exception being handled autonomously (sentiment score: 2/10), while an annoyed customer asking to reset a password gets escalated (sentiment score: 8/10). What is the fundamental flaw in this approach?",o:[{l:"A",t:"The sentiment analysis model needs retraining on support-specific data"},{l:"B",t:"Sentiment doesn't reliably correlate with case complexity - a frustrated customer with a simple issue gets escalated unnecessarily, while a calm customer with a genuine policy exception that requires human judgment may not"},{l:"C",t:"The threshold needs to be raised from 8/10 to 9/10 to reduce false positives"},{l:"D",t:"Sentiment analysis should only run at the end of the conversation, not during it"}],a:["B"],r:"Sentiment measures how the customer feels, not whether the case genuinely requires human intervention. The correlation between frustration and case complexity is weak - escalation criteria should be based on case characteristics (policy gaps, authorization requirements, inability to progress) rather than emotional signals.",w:"A improves the proxy without fixing the fundamental disconnect; C tunes a flawed metric; D changes timing but not the underlying mismatch."},
{id:"Q12",s:1,d:5,ty:"multi",se:2,q:"In long multi-issue support sessions, your agent's later responses increasingly misquote refund amounts, confuse order numbers between issues, and state incorrect dates. Investigation reveals two compounding problems: (1) earlier transactional details are being condensed into vague summaries like \"the customer's refund\" during progressive summarization, and (2) each lookup_order call dumps 40+ fields into context when only 5 are relevant to the current issue. Which TWO changes address these root causes?",o:[{l:"A",t:"Extract critical transactional facts - amounts, dates, order numbers, statuses - into a persistent \"case facts\" block included in every prompt outside the summarized conversation history"},{l:"B",t:"Increase max_tokens so the agent's responses can be longer and include more detail"},{l:"C",t:"Trim each tool result to only the fields relevant to the current issue before it enters the conversation context"},{l:"D",t:"Ask the customer to periodically confirm key details like order numbers and amounts"}],a:["A","C"],r:"The paired fix addresses both root causes: (1) persisting transactional facts in a dedicated block protects them from lossy summarization, and (2) trimming verbose tool outputs at the source prevents irrelevant fields from consuming context budget and creating confusion.",w:"B controls output length, not context quality; D outsources a system memory problem to the customer."},
{id:"Q13",s:1,d:5,ty:"single",q:"The get_customer tool returns three matching records for a customer named \"Sarah Johnson.\" The agent selects the record in the same city as the support phone number's area code and proceeds to process a refund. The selected account turns out to be a different Sarah Johnson. What should the agent do when tool results return multiple matches?",o:[{l:"A",t:"Select the customer with the most recent order activity, as they are most likely to be contacting support"},{l:"B",t:"Select the first record returned, since the tool returns results in relevance order"},{l:"C",t:"Ask the customer for additional identifying information - such as account number, email address, or phone number - to disambiguate before proceeding"},{l:"D",t:"Escalate to a human agent immediately, since multiple matches cannot be resolved by automation"}],a:["C"],r:"When multiple records match, the agent should request additional identifiers for disambiguation. Heuristic selection by city, recency, or position is unreliable and risks acting on the wrong account - a particularly dangerous failure when financial operations follow.",w:"A and B use unreliable heuristics; D escalates unnecessarily when a simple clarification question can resolve the ambiguity."},
{id:"Q14",s:1,d:1,ty:"single",q:"Your agent occasionally ends support sessions in an undefined state - the customer receives no resolution and no escalation to a human. This happens when the agentic loop terminates due to a max_tokens limit or an unexpected error, without the agent having reached a conclusion. Customers are left waiting with no follow-up. What orchestration-layer safeguard addresses this?",o:[{l:"A",t:"Increase max_tokens to ensure the agent always has room to finish"},{l:"B",t:"Add a session-level guard that verifies the final state is either a completed resolution or a confirmed human escalation - if neither occurred, automatically trigger escalation with whatever context has been accumulated"},{l:"C",t:"Log all incomplete sessions for weekly review by the support team"},{l:"D",t:"Add a 30-second timeout that auto-closes sessions, sending the customer a \"we're looking into it\" message"}],a:["B"],r:"An orchestration-layer safeguard ensures every session terminates in a defined end state. If the loop exits for any reason without resolution or escalation, the guard catches this and forces escalation with accumulated context, preventing customers from falling into a void.",w:"A doesn't prevent all termination causes; C is reactive not preventive; D creates the same undefined state with a misleading message."},{id:"Q15",s:2,d:3,ty:"single",q:"You have a personal /scratch-notes slash command you use constantly during development to jot down architectural observations. When a new teammate clones the repository, they see your /scratch-notes command in their Claude Code session and are confused by its purpose. Where should personal workflow commands be stored so they don't appear for teammates?",o:[{l:"A",t:"In .claude/commands/ in the repository, with a comment noting it's personal"},{l:"B",t:"In the root CLAUDE.md under a # Personal Commands heading"},{l:"C",t:"In ~/.claude/commands/ in your home directory, where user-scoped commands live outside version control"},{l:"D",t:"In .claude/rules/ with a paths glob matching only files you typically edit"}],a:["C"],r:"Command scoping mirrors intent: ~/.claude/commands/ holds personal commands visible only to you. Commands in .claude/commands/ are shared with everyone via version control. A personal workflow tool that confuses teammates belongs in the user-scoped directory.",w:"A publishes to the team via VCS; B is for project context, not command definitions; D misuses path-scoped rules for user scoping."},
{id:"Q16",s:2,d:3,ty:"single",q:"Your /analyze-architecture skill runs a deep exploration of the codebase, producing thousands of lines of discovery output - file listings, dependency traces, and module analyses. This output floods the main conversation context, pushing out the task you actually wanted help with afterward. Which SKILL.md frontmatter option isolates this verbose output?",o:[{l:"A",t:"argument-hint, so the skill prompts for which areas to analyze and produces less output"},{l:"B",t:"context: fork, which runs the skill in an isolated sub-agent context and returns only the distilled results to the main conversation"},{l:"C",t:"allowed-tools restricted to Read only, so the skill cannot produce as much output"},{l:"D",t:"paths set to architecture files only, limiting the scope of exploration"}],a:["B"],r:"context: fork runs the skill in its own isolated context. The main session receives only the distilled result - not the thousands of lines of intermediate exploration. This is the designed mechanism for skills that produce verbose or exploratory output.",w:"A controls parameter prompting not output volume; C limits tools not context pollution; D restricts scope but doesn't isolate output."},
{id:"Q17",s:2,d:3,ty:"single",q:"You are writing a /scaffold-component skill that generates boilerplate files for new React components. Security review requires a guarantee that this skill can create and write files but can never execute shell commands - even if a creative prompt injection attempts to make it run arbitrary bash commands through the skill's instructions. How do you enforce this?",o:[{l:"A",t:"Add a prominent instruction in the SKILL.md body: \"NEVER run Bash commands under any circumstances\""},{l:"B",t:"Trust that the skill's narrow purpose (file generation) will naturally keep it away from shell commands"},{l:"C",t:"Run the skill only in plan mode so it can't execute anything"},{l:"D",t:"Set allowed-tools in the SKILL.md frontmatter to permit only Write and Read operations, excluding Bash - a configuration-level guarantee"}],a:["D"],r:"allowed-tools is a deterministic enforcement mechanism: the skill literally cannot invoke tools not in its allowed list, regardless of what its instructions say or what the model attempts. This provides the security guarantee that prompt-level instructions (A) cannot.",w:"A has a non-zero failure rate; B is hope, not security; C changes the workflow mode but doesn't restrict per-skill tool access."},
{id:"Q18",s:2,d:3,ty:"single",q:"A new engineer joins the team and their Claude Code sessions consistently ignore the team's coding standards - no consistent import ordering, wrong error handling patterns, missing JSDoc comments. You discover the coding standards are documented in your own ~/.claude/CLAUDE.md file. What is the correct fix, and how do you verify it works?",o:[{l:"A",t:"Move the standards into the project-level CLAUDE.md (committed to the repository) so every developer receives them on clone - then use /memory to verify which configuration files a session has loaded"},{l:"B",t:"Email the new engineer your ~/.claude/CLAUDE.md file to copy into their home directory"},{l:"C",t:"Have the new engineer reinstall Claude Code to pick up a fresh default configuration"},{l:"D",t:"Paste the standards at the start of each new session until the model \"learns\" them"}],a:["A"],r:"User-level CLAUDE.md applies only to that user and never travels via version control. Team standards must be in project-level configuration so every clone receives them automatically. The /memory command verifies which configuration files a session actually loaded.",w:"B distributes by hand and drifts immediately; C reinstalls software for a file-location problem; D treats a persistent configuration issue as a per-session prompting task."},
{id:"Q19",s:2,d:3,ty:"single",q:"Your project's CLAUDE.md has grown to 2,000 lines covering testing conventions, API design patterns, deployment procedures, and code style guidelines. Every Claude Code session loads all 2,000 lines regardless of what the developer is working on - someone fixing a CSS bug loads deployment procedures, and someone writing API handlers loads CSS conventions. What is the recommended reorganization?",o:[{l:"A",t:"Delete the file entirely and rely on the model's general knowledge of best practices"},{l:"B",t:"Move everything to each developer's user-level ~/.claude/CLAUDE.md so it's personalized"},{l:"C",t:"Split into focused, topic-specific files in .claude/rules/ (e.g., testing.md, api-conventions.md, deployment.md), adding YAML frontmatter with glob patterns so each file loads only when editing matching files"},{l:"D",t:"Convert the entire file into a single slash command that developers invoke manually when they need the standards"}],a:["C"],r:"The .claude/rules/ directory is the modular alternative to a monolithic CLAUDE.md: focused topic files with path-scoped frontmatter. Testing conventions load only when editing test files, API conventions only for API files - reducing irrelevant context while maintaining coverage.",w:"A abandons hard-won conventions; B unshares team configuration and causes divergence; D makes always-relevant standards opt-in and forgettable."},
{id:"Q20",s:2,d:3,ty:"single",q:"Your monorepo contains three packages (frontend, backend, shared-lib), each with different coding conventions. The frontend uses functional React patterns, the backend uses async/await with specific error handling, and shared-lib follows a strict interface-first design. Currently, a single CLAUDE.md tries to cover all three with sections like \"## When working in frontend/...\" but Claude frequently applies backend patterns to frontend code. What mechanism lets each package maintain its own standards modularly?",o:[{l:"A",t:"Create a CLAUDE.md in each package subdirectory repeating the shared standards plus package-specific ones"},{l:"B",t:"Use the @import syntax in each package's CLAUDE.md to include only the relevant shared standards files, plus package-specific rules"},{l:"C",t:"Create one .claude/rules/ file per package with no frontmatter, loading all rules for all packages at all times"},{l:"D",t:"Have developers manually switch between configuration profiles when working in different packages"}],a:["B"],r:"The @import syntax lets each package's CLAUDE.md reference only the shared standards files relevant to it, keeping configuration modular and DRY. Each package gets its own combination of shared + package-specific rules without content duplication.",w:"A duplicates shared standards across packages; C loads everything regardless of context; D requires manual intervention that will be forgotten."},
{id:"Q21",s:2,d:3,ty:"single",q:"Test files in your codebase are spread throughout the directory tree alongside the code they test (e.g., Button.test.tsx next to Button.tsx, api.test.ts next to api.ts). You want all test files to follow the same testing conventions - using your fixture library, specific assertion patterns, and coverage requirements - regardless of which directory they're in. What is the most maintainable way to apply these conventions automatically?",o:[{l:"A",t:"Create a .claude/rules/testing.md file with YAML frontmatter specifying paths: [\"**/*.test.*\", \"**/*.spec.*\"] so the conventions load whenever Claude edits any test file"},{l:"B",t:"Place a separate CLAUDE.md file in every directory that contains test files, each with the testing conventions"},{l:"C",t:"Add the testing conventions to the root CLAUDE.md and trust Claude to recognize when it's working on a test file"},{l:"D",t:"Create a /apply-test-conventions slash command that developers must remember to run before writing tests"}],a:["A"],r:"Path-specific rules with glob patterns apply conventions based on file naming patterns regardless of directory location. A single rules file with paths: [\"**/*.test.*\"] covers test files scattered throughout the entire codebase automatically.",w:"B requires a CLAUDE.md in every directory and doesn't scale; C relies on inference rather than explicit matching; D requires manual invocation that will be forgotten."},
{id:"Q22",s:2,d:3,ty:"single",q:"You want to create a /deploy-checklist slash command that runs your team's standard pre-deployment verification workflow. This command should be available to every developer automatically when they clone the repository, without any manual setup. Where should the command file be created?",o:[{l:"A",t:"In ~/.claude/commands/ in each developer's home directory, with setup instructions in the wiki"},{l:"B",t:"In .claude/commands/ in the project repository, so it's version-controlled and available on clone"},{l:"C",t:"In the root CLAUDE.md under a # Commands heading"},{l:"D",t:"In .claude/skills/ as a skill with context: fork"}],a:["B"],r:"Project-scoped commands in .claude/commands/ are version-controlled and automatically available to every developer on clone or pull. User-scoped commands (~/.claude/commands/) require manual setup per developer.",w:"A requires manual setup per developer; C is for instructions not command definitions; D is a different mechanism - skills vs commands."},
{id:"Q23",s:2,d:3,ty:"single",q:"Your team wants to enforce that specific instructions are handled differently based on their compliance requirements. Security rules (no hardcoded credentials, no eval()) must be enforced with zero tolerance. Code style preferences (4-space indentation, trailing commas) should guide the model but occasional deviations are acceptable. Currently everything is in CLAUDE.md. How should these be restructured?",o:[{l:"A",t:"Keep everything in CLAUDE.md but mark security rules with \"CRITICAL:\" prefix"},{l:"B",t:"Move security rules to hooks or settings permissions for deterministic enforcement; keep style preferences in CLAUDE.md as guidance the model follows with high but not guaranteed compliance"},{l:"C",t:"Move everything to hooks for maximum enforcement"},{l:"D",t:"Move style preferences to hooks and keep security rules in CLAUDE.md since they're more important to document"}],a:["B"],r:"The dividing line is tolerance for violation: security rules requiring zero tolerance belong in hooks or settings permissions (deterministic enforcement). Style preferences that tolerate occasional deviation belong in CLAUDE.md (probabilistic guidance). Each mechanism matches its compliance requirement.",w:"A adds emphasis without changing enforcement level; C over-engineers style guidance that doesn't need determinism; D inverts the relationship."},
{id:"Q24",s:2,d:3,ty:"single",q:"A developer needs to provide context about a legacy database migration script for a one-time refactoring task. The context includes specific table mappings and column renames that won't be relevant after today. What is the most appropriate method for providing this context to Claude Code?",o:[{l:"A",t:"Add the migration details to the project-level CLAUDE.md so it's always available in case the context is needed again"},{l:"B",t:"Create a .claude/rules/ file scoped to the migration script's path"},{l:"C",t:"Use an @ reference to the migration documentation or provide the details inline in the conversation - context that's session-specific and won't be reused doesn't need persistent configuration"},{l:"D",t:"Create a custom skill that loads the migration context on invocation"}],a:["C"],r:"For one-time, session-specific context, @ references or inline description in the conversation are appropriate. CLAUDE.md and .claude/rules/ are for reusable, cross-session guidance. Persistent config for a one-time task adds maintenance burden with no future benefit.",w:"A adds permanent config for temporary context; B creates a rules file that will be stale tomorrow; D is over-engineered for a single use."},
{id:"Q25",s:2,d:3,ty:"single",q:"Two tasks arrive simultaneously: (1) fixing an off-by-one error in a single pagination function - you have a clear stack trace showing the exact line - and (2) migrating the codebase from Express to Fastify, touching 45+ route handlers with several viable migration strategies. How should plan mode and direct execution be assigned?",o:[{l:"A",t:"Plan mode for both tasks - planning never hurts and ensures quality"},{l:"B",t:"Direct execution for both - plan mode slows down simple fixes and experienced developers don't need it for migrations"},{l:"C",t:"Direct execution for the well-scoped single-line bug fix; plan mode for the 45-file migration whose scale and multiple valid approaches demand exploration and design before committing changes"},{l:"D",t:"Plan mode for the bug fix (to understand root cause) and direct execution for the migration (to move quickly)"}],a:["C"],r:"The selection rule: direct execution for simple, well-scoped changes with clear fixes; plan mode when scale, architectural implications, or competing approaches make design-before-commitment valuable. A single-line bug with a stack trace doesn't need a plan; a 45-file migration does.",w:"A adds unnecessary ceremony to a trivial fix; B risks costly rework on a large migration; D inverts the rule for both tasks."},
{id:"Q26",s:2,d:1,ty:"single",q:"Yesterday you ran a long investigation into a memory leak in a session you named \"leak-hunt,\" identifying three suspicious allocation sites and narrowing the root cause to a connection pool. Today you want to continue exactly where that investigation left off, with all the findings and context from yesterday's session. What do you run?",o:[{l:"A",t:"claude --continue-all, which reopens every recent session and lets you select one"},{l:"B",t:"claude --resume leak-hunt, which restores the named session's full conversation context so the investigation picks up where it stopped"},{l:"C",t:"claude -p \"continue the memory leak investigation from yesterday\" - the -p flag with a descriptive prompt will reconstruct the context"},{l:"D",t:"Start a new session and paste yesterday's terminal scrollback as the first message to provide the prior context"}],a:["B"],r:"Named session resumption (--resume <session-name>) is the designed mechanism for continuing specific prior work. It restores the full conversation context - all tool results, findings, and reasoning - so the investigation continues seamlessly.",w:"A is not a real flag; C starts a fresh non-interactive run with no memory; D approximates context badly with unstructured terminal output."},
{id:"Q27",s:2,d:1,ty:"single",q:"You completed a thorough analysis of a legacy module - reading 20+ files, tracing dependencies, and mapping the data flow. Now you want to compare two competing refactoring strategies: one extracts a service layer, the other introduces an event-driven pattern. You need to develop each approach independently from the same analysis baseline without cross-contamination. What capability fits?",o:[{l:"A",t:"Run both strategies sequentially in the same session, asking Claude to \"forget\" the first approach before starting the second"},{l:"B",t:"Open two brand-new sessions and redo the complete module analysis in each before starting the respective strategies"},{l:"C",t:"Use /compact between the two explorations to clear the first approach's context before starting the second"},{l:"D",t:"Use fork_session to create two independent branches from the shared analysis baseline, exploring one strategy per branch without cross-contamination"}],a:["D"],r:"fork_session creates divergent exploration branches that both inherit the completed analysis. Each branch evolves independently - the service-layer exploration doesn't influence the event-driven exploration. Clean comparison without re-paying the expensive analysis cost.",w:"A is impossible - conversation context cannot be selectively forgotten; B pays for the 20+ file analysis twice; C compresses context within one session but doesn't create parallel independent paths."},
{id:"Q28",s:2,d:5,ty:"single",q:"Mid-way through an extended codebase exploration session, you notice Claude's responses are becoming vague and generic. It references \"typical patterns\" and \"standard approaches\" instead of the specific class names and method signatures it discovered earlier. Response quality is visibly degrading, but you're not ready to end the session - you're mid-investigation. Which built-in command helps immediately?",o:[{l:"A",t:"/memory, which shows which configuration files are loaded and helps diagnose inconsistencies"},{l:"B",t:"/fork, which creates a branch of the session for parallel exploration"},{l:"C",t:"/compact, which reduces context usage by compressing the conversation history so the session can continue productively with refreshed attention"},{l:"D",t:"/rules, which reloads the .claude/rules/ files and may reset the session's behavior"}],a:["C"],r:"/compact is the in-session relief valve for context saturation. It compresses accumulated conversation history - typically bloated with verbose tool outputs and discovery - allowing the session to continue with restored response quality.",w:"A is diagnostic not therapeutic; B is for branching not compression; D addresses rule loading not context bloat."},
{id:"Q29",s:2,d:3,ty:"single",q:"A team wants to enforce that after every file edit in Claude Code, the project's formatter (prettier) and linter (eslint) run automatically - even if the model's instructions don't mention formatting. This should happen deterministically for every edit, not just when the model decides to. What mechanism provides this guarantee?",o:[{l:"A",t:"Add \"always run prettier and eslint after editing files\" to CLAUDE.md"},{l:"B",t:"A PostToolUse hook that automatically triggers prettier and eslint after every Write or Edit tool invocation, independent of model instruction-following"},{l:"C",t:"A custom skill that developers invoke after making edits"},{l:"D",t:"Few-shot examples showing the model running the formatter after each edit"}],a:["B"],r:"PostToolUse hooks fire automatically after specific tool invocations. By hooking into Write and Edit, formatting and linting run deterministically after every file change - a guarantee that CLAUDE.md instructions and few-shot examples cannot provide.",w:"A is probabilistic guidance the model may skip; C requires manual invocation; D is probabilistic and adds context overhead."},{id:"Q30",s:3,d:1,ty:"single",q:"Your coordinator agent's system prompt clearly instructs it to delegate research tasks to specialized subagents. However, at runtime the coordinator attempts all research itself - calling web search tools directly, analyzing documents in its own context, and producing synthesis without any subagent involvement. Its allowedTools configuration restricts it to research-planning tools (decompose_query, evaluate_coverage, compile_report). What is the most likely cause of the delegation failure?",o:[{l:"A",t:"The coordinator's model tier is too small to understand delegation instructions"},{l:"B",t:"Subagents must be pre-started and registered before the coordinator can invoke them"},{l:"C",t:"The system prompt needs the word \"delegate\" in capital letters for emphasis"},{l:"D",t:"The coordinator's allowedTools does not include \"Task\" - the Task tool is the mechanism for spawning subagents, and without it in the allowed list, no delegation can occur regardless of prompt instructions"}],a:["D"],r:"Subagent spawning happens through the Task tool. A coordinator whose allowedTools omits \"Task\" has no mechanism to delegate - capability configuration takes precedence over prompt instructions, no matter how clearly written.",w:"A and C look for failures in comprehension when the issue is a configuration omission; B describes a startup model that doesn't exist - subagents are spawned on demand via Task."},
{id:"Q31",s:3,d:1,ty:"single",q:"Your web search subagent gathers excellent, detailed findings about market trends. The synthesis subagent then produces a generic, surface-level report that references none of the specific data, statistics, or sources the web search found. The coordinator invokes the synthesis subagent with the prompt: \"Synthesize the research findings into a comprehensive report.\" What explains the synthesis agent's poor output?",o:[{l:"A",t:"The synthesis subagent's model needs extended thinking enabled to process complex research"},{l:"B",t:"Subagents do not inherit the coordinator's conversation history - the synthesis agent has never seen the web search findings because the coordinator didn't include them in the synthesis prompt"},{l:"C",t:"The synthesis subagent needs its own web search tools to independently gather the findings"},{l:"D",t:"The word \"comprehensive\" in the prompt is too vague - replacing it with \"detailed\" would fix the output quality"}],a:["B"],r:"Subagent context isolation is a fundamental design principle: each subagent sees only what its prompt explicitly contains. \"The research findings\" refers to material the synthesis agent has never encountered. The coordinator must pass the actual data - search results, extracted facts, source URLs - directly in the synthesis prompt.",w:"A adds reasoning capacity over empty input; C duplicates the search agent's role; D adjusts wording for a prompt that's missing the essential data."},
{id:"Q32",s:3,d:1,ty:"single",q:"Your coordinator sequentially invokes the web search subagent (15 seconds), waits for completion, then invokes the document analysis subagent (20 seconds) - resulting in 35 seconds total latency. The two research tasks are completely independent: web search looks at online sources while document analysis processes uploaded PDFs. How do you cut the latency roughly in half?",o:[{l:"A",t:"Ask each subagent to work faster by adding urgency instructions to their system prompts"},{l:"B",t:"Have the coordinator emit both Task tool calls in a single response, which spawns the subagents in parallel - both execute concurrently and results return together"},{l:"C",t:"Merge the two subagents into a single agent that handles both web search and document analysis"},{l:"D",t:"Run two separate copies of the entire coordinator system and merge their outputs in a downstream service"}],a:["B"],r:"Parallel subagent spawning is achieved by emitting multiple Task tool calls in one coordinator response rather than across separate sequential turns. Independent workstreams then execute concurrently, cutting latency to the duration of the slowest subagent rather than the sum.",w:"A adds urgency that doesn't affect execution time; C loses specialization for marginal gains; D duplicates the entire system for a one-line orchestration fix."},
{id:"Q33",s:3,d:1,ty:"single",q:"Your coordinator gives subagents rigid step-by-step research procedures: \"Run these five specific queries in this exact order, then summarize the top 3 results from each.\" When assigned a research topic that doesn't fit the scripted query patterns, subagents either produce irrelevant results or fail entirely. How should coordinator prompts be redesigned?",o:[{l:"A",t:"Make the procedures even more detailed, adding branching logic for different topic types"},{l:"B",t:"Remove all instructions and let subagents figure out their tasks entirely from context"},{l:"C",t:"Specify research goals and quality criteria - what a complete answer looks like, what sources are acceptable, what depth is expected - and let the subagent adapt its query strategy to what it discovers"},{l:"D",t:"Have subagents ask the human operator for guidance whenever the script doesn't match the topic"}],a:["C"],r:"Goal-and-criteria prompts preserve subagent adaptability. The coordinator defines what success looks like (coverage depth, source quality, evidence requirements); the subagent determines how to achieve it. This is why you use an intelligent agent rather than a fixed script.",w:"A arms-races against topic variety; B removes the success criteria; D reintroduces a human into an autonomous loop."},
{id:"Q34",s:3,d:1,ty:"single",q:"Reports from your research system are coherent and well-written but consistently shallow on some subtopics - a 20-page report on \"AI in healthcare\" covers diagnostics thoroughly but barely mentions drug discovery, clinical trials, or regulatory implications. You want the system to notice and repair its own coverage gaps before finalizing. Which orchestration pattern achieves this?",o:[{l:"A",t:"Accept the first synthesis as final to control costs - shallow coverage is acceptable"},{l:"B",t:"An iterative refinement loop: the coordinator evaluates the synthesis output for coverage gaps, re-delegates to search and analysis subagents with targeted follow-up queries addressing the gaps, and re-invokes synthesis until coverage meets defined criteria"},{l:"C",t:"Ask the report generation subagent to pad thin sections with general knowledge from its training data"},{l:"D",t:"Always run every subagent exactly twice regardless of output quality - the second pass catches what the first missed"}],a:["B"],r:"Iterative refinement closes the quality loop: evaluate coverage against criteria, dispatch targeted follow-up research for identified gaps, re-synthesize, and repeat until the report meets standards. This is adaptive - effort goes where gaps exist rather than being uniformly applied.",w:"A ships a known defect; C fills gaps with uncited generalities; D doubles cost blindly without gap-directed targeting."},
{id:"Q35",s:3,d:2,ty:"single",q:"Every subagent in your research system currently receives the full 18-tool catalog. Production logs reveal the synthesis agent attempting web searches (and failing), the web search agent trying to parse PDF documents (and producing garbage), and frequent wrong-tool selections across all subagents. What is the correct architectural fix?",o:[{l:"A",t:"Add a 19th meta-tool that tells each agent which of the 18 tools to use for its current task"},{l:"B",t:"Alphabetize the tool list so agents can find the right tool more easily"},{l:"C",t:"Write longer system prompts warning each agent about the 14+ tools it should never use"},{l:"D",t:"Scope each subagent's tool set to its role - give the web search agent 4-5 search-related tools, the document analyzer its parsing tools, and the synthesis agent only its composition tools"}],a:["D"],r:"Tool distribution is an architectural control. Agents choose more reliably among 4-5 role-relevant tools than among 18 unrelated ones. Out-of-role tools aren't just unused - they're actively misused because they're available.",w:"A adds selection complexity to solve selection complexity; B changes presentation not decision difficulty; C asks prompts to fight a problem that configuration should solve."},
{id:"Q36",s:3,d:2,ty:"single",q:"Subagents in your research pipeline burn 30-40% of their tool call budget on exploratory calls before doing actual research - listing available document collections, probing for database schemas, checking what issue categories exist. This discovery overhead significantly increases latency and cost. Which MCP capability reduces this?",o:[{l:"A",t:"Increase each subagent's tool call budget so the discovery phase is affordable"},{l:"B",t:"Hard-code the current data inventory into each subagent's system prompt"},{l:"C",t:"Expose content catalogs - document hierarchies, schema listings, issue summaries - as MCP resources that agents can browse without making tool calls"},{l:"D",t:"Remove all discovery tools so agents work without knowing what data is available"}],a:["C"],r:"MCP resources are designed for exactly this: exposing browsable content catalogs that give agents visibility into available data upfront. Discovery becomes a resource read instead of dozens of exploratory tool calls.",w:"A pays for inefficiency instead of eliminating it; B goes stale the moment data changes; D replaces wasted calls with blind guessing."},
{id:"Q37",s:3,d:5,ty:"single",q:"Final research reports from your system state findings as facts but cite no sources. Investigation reveals the problem is structural: each summarization step compresses the web search agent's source attributions away. By the time findings reach the synthesis agent, they're anonymous claims like \"the market is growing at 15%\" with no indication of where that figure came from. What is the fix?",o:[{l:"A",t:"Have the report generation agent add plausible-looking citations at the end based on the topic"},{l:"B",t:"Instruct the synthesis agent to write \"sources available on request\" at the bottom of each report"},{l:"C",t:"Require all subagents to output structured claim-source mappings - each finding paired with its source URL, document name, and relevant excerpt - that every downstream agent must preserve and merge through synthesis"},{l:"D",t:"Reduce the number of summarization steps to one, so there's less opportunity to lose attribution"}],a:["C"],r:"Provenance survives only when it's structural: claim-source mappings travel as first-class data through every agent hop. The synthesis agent merges attributed claims rather than compressing anonymous assertions. Attribution is preserved by design, never reconstructed after the fact.",w:"A fabricates citations - worse than none; B advertises attribution the system no longer has; D reduces but doesn't eliminate the stripping since even one summarization step can lose sources."},
{id:"Q38",s:3,d:5,ty:"single",q:"Two credible industry sources report different market size figures for the same sector: Source A says $12.4 billion (published January 2026), Source B says $8.7 billion (published March 2025). One subagent's summary simply used the larger figure. How should conflicting data from credible sources be handled?",o:[{l:"A",t:"Average the two figures into $10.55 billion as a compromise"},{l:"B",t:"Always use the more recent figure and discard the older one"},{l:"C",t:"Annotate the conflict explicitly - both values with source attribution - and require publication dates in structured outputs so temporal differences can be recognized rather than misinterpreted as contradictions"},{l:"D",t:"Exclude both figures to avoid presenting inaccurate information"}],a:["C"],r:"Conflicts are information, not errors. Both values with attribution let the coordinator make an informed reconciliation decision. Publication dates in structured output reveal whether the figures measure different time periods rather than contradicting each other.",w:"A invents a number no source reported; B automates a decision that requires judgment; D discards two credible data points."},
{id:"Q39",s:3,d:5,ty:"single",q:"In multi-agent synthesis, your final reports consistently omit or under-represent findings from the middle sections of long aggregated subagent outputs. The first and last subagent's findings are well-represented, but the middle subagent's critical financial data is often missing from the synthesis. What cognitive effect explains this, and how do you mitigate it?",o:[{l:"A",t:"This is the \"lost in the middle\" effect - models process the start and end of long inputs more reliably than the middle. Mitigate by placing key findings summaries at the beginning of aggregated inputs and organizing results with explicit section headers"},{l:"B",t:"The middle subagent is producing lower-quality output that the synthesis agent correctly deprioritizes"},{l:"C",t:"Increase max_tokens to give the synthesis agent more room to include middle-section content"},{l:"D",t:"Randomize the order of subagent outputs on each run to distribute the omission randomly"}],a:["A"],r:"The \"lost in the middle\" effect is well-documented: models attend more reliably to the beginning and end of long contexts. Placing key summaries at the start and using explicit section headers ensures critical findings receive appropriate attention regardless of position.",w:"B incorrectly blames output quality; C adds output space not input attention; D distributes the problem randomly rather than solving it."},
{id:"Q40",s:3,d:1,ty:"single",q:"Your coordinator agent always invokes all four subagents - web search, document analysis, synthesis, and report generation - for every query, including simple factual questions like \"When was the Paris Agreement signed?\" that only need a quick web search. This wastes resources and adds 30+ seconds of latency to simple queries. What should the coordinator do differently?",o:[{l:"A",t:"Nothing - running all subagents ensures the most thorough response regardless of query complexity"},{l:"B",t:"Analyze the query's requirements and dynamically select which subagents to invoke - simple factual queries route to web search only, while complex research topics invoke the full pipeline"},{l:"C",t:"Remove three subagents and keep only web search to optimize for the common case"},{l:"D",t:"Let the user manually specify which subagents should run for each query"}],a:["B"],r:"Coordinators should dynamically select subagents based on query complexity. A simple factual question doesn't need document analysis, synthesis, or report generation. Dynamic routing optimizes both latency and cost while preserving full capability for complex queries.",w:"A wastes resources on simple queries; C removes capability for complex ones; D shifts architectural decisions to users who shouldn't need to understand the system's internals."},
{id:"Q41",s:3,d:5,ty:"single",q:"Your multi-agent system needs crash recovery capability. If the coordinator fails mid-research (due to a timeout, network issue, or process restart), the system currently loses all completed subagent work and must restart from scratch - wasting up to 10 minutes of prior computation. How should crash recovery be designed?",o:[{l:"A",t:"Re-run the entire pipeline from the beginning - it's the simplest approach"},{l:"B",t:"Cache all raw API responses in a database and replay them on restart"},{l:"C",t:"Each subagent exports its completed findings and status to a structured manifest file at a known location. On restart, the coordinator loads the manifest, identifies what's already complete, and resumes only the unfinished work"},{l:"D",t:"Rely on the coordinator's conversation history persisting across process restarts"}],a:["C"],r:"Structured state persistence via manifest files lets the coordinator resume intelligently. Each agent writes its findings and completion status; on restart, the coordinator reads the manifest, skips completed work, and picks up where it left off.",w:"A wastes all prior computation; B replays raw responses rather than resuming at the logical checkpoint; D assumes session persistence that doesn't survive process restarts."},
{id:"Q42",s:3,d:1,ty:"single",q:"A coordinator agent delegates to a web search subagent and a document analysis subagent. During development, you discover the two subagents have begun exchanging messages directly - the web search agent sends URLs to the document analysis agent without going through the coordinator. This bypasses the coordinator's error handling and makes debugging difficult. What is the architectural risk?",o:[{l:"A",t:"Direct subagent communication reduces token usage, so this is actually an improvement"},{l:"B",t:"It breaks the hub-and-spoke model, removing the coordinator's visibility into inter-agent communication and making error handling, logging, and recovery inconsistent"},{l:"C",t:"Direct messages between subagents are unsupported by the API and will cause runtime errors"},{l:"D",t:"It causes the subagents to share a single context window, leading to context exhaustion"}],a:["B"],r:"The recommended architecture is hub-and-spoke: the coordinator routes all inter-subagent communication. Direct communication bypasses the coordinator's oversight - error handling, logging, retry logic, and information routing all break down when agents talk without supervision.",w:"A ignores the operational risks; C may not cause errors but creates architectural problems; D misunderstands context isolation."},
{id:"Q43",s:3,d:5,ty:"single",q:"A synthesis report needs to clearly distinguish between findings that are well-supported by multiple sources and topic areas where the research was incomplete due to failed searches or unavailable sources. Currently, the report presents everything with equal confidence. How should the output be structured?",o:[{l:"A",t:"Omit any topic area where sources were unavailable - only include well-supported findings"},{l:"B",t:"Include coverage annotations throughout the report indicating which findings are well-supported versus which topic areas have gaps due to unavailable sources"},{l:"C",t:"Add a generic disclaimer at the end: \"Some sources may not have been available\""},{l:"D",t:"Mark all findings as equally confident to avoid undermining the report's authority"}],a:["B"],r:"Coverage annotations let report consumers distinguish well-supported claims from areas where research was incomplete. This enables informed decision-making rather than false confidence in uniformly-presented but unevenly-supported findings.",w:"A silently drops important topics; C is too generic to be actionable; D is dishonest about the report's evidence basis."},{id:"Q44",s:4,d:2,ty:"single",q:"Your developer productivity agent must accomplish two tasks: (a) locate every file matching the test naming convention (*.test.tsx) anywhere in the repository, and (b) find every location where the string \"PaymentDeclinedError\" appears in code. A junior developer suggests using Grep for both tasks. Why is this incorrect, and what is the right tool pairing?",o:[{l:"A",t:"Glob with a pattern like **/*.test.tsx for finding test files by name pattern, and Grep for searching file contents for the string \"PaymentDeclinedError\" - Glob matches file paths, Grep searches file contents"},{l:"B",t:"Grep with a filename filter for the test files, and Glob with a content search for the error string"},{l:"C",t:"Bash with find and cat piped together for both tasks - the built-in tools are wrappers around these anyway"},{l:"D",t:"Read every file in the repository and search the contents manually for both the naming pattern and the error string"}],a:["A"],r:"The tool division is clean: Glob matches file paths against patterns (names, extensions, directories); Grep searches file contents for text patterns (identifiers, error strings, imports). Using the right tool for each task is more efficient and more reliable than misapplying one tool to both.",w:"B swaps the tools into each other's territory; C abandons purpose-built tools for brute-force; D exhausts the context window immediately."},
{id:"Q45",s:4,d:2,ty:"single",q:"Your agent attempts to use the Edit tool to modify a legacy file, but the edit fails: the anchor text it targeted (a common boilerplate pattern like \"if (error) { return null; }\") appears in six places in the file. The Edit tool requires a unique text match and rejects ambiguous anchors. What is the standard fallback approach?",o:[{l:"A",t:"Delete five of the six occurrences so the remaining one becomes a unique match"},{l:"B",t:"Retry the same Edit call repeatedly - the tool may succeed on subsequent attempts"},{l:"C",t:"Switch to Bash and use sed to perform the modification with line-number targeting"},{l:"D",t:"Use Read to load the full file contents, make the modification in the complete text, then Write the entire modified file - the reliable fallback when Edit cannot find unique anchor text"}],a:["D"],r:"Read + Write is the documented fallback for Edit's unique-match requirement. Loading the full file gives you complete control over the modification without depending on text uniqueness. This is reliable regardless of how repetitive the file's structure is.",w:"A mutilates code to satisfy a tool requirement; B retries a deterministic failure; C uses fragile stream editing when a purpose-built fallback exists."},
{id:"Q46",s:4,d:2,ty:"single",q:"A developer asks the agent to explain how the billing module works. The agent immediately begins reading every file in the src/billing/ directory (30+ files) and exhausts its context window before producing any answer. Most of the files turn out to be helper utilities and type definitions irrelevant to understanding the core billing flow. What is the correct exploration strategy?",o:[{l:"A",t:"Read files in alphabetical order until the context budget is spent, then answer with whatever was loaded"},{l:"B",t:"Start with Grep to find entry points - exported functions, key class names, error strings - then Read selectively to follow only the most relevant import chains and trace the core billing flow"},{l:"C",t:"Ask the developer to explain the billing module first, then confirm their understanding"},{l:"D",t:"Read only the README.md in the billing directory and reason entirely from documentation"}],a:["B"],r:"Systematic incremental exploration: use Grep to locate relevant entry points (function names, imports, error patterns), then Read selectively to trace the flows that matter. This builds targeted understanding while managing the context budget - spending tokens on relevant code rather than exhaustively loading everything.",w:"A wastes context on irrelevant files by alphabetical accident; C outsources the agent's core job; D trusts documentation that may be outdated or missing in legacy code."},
{id:"Q47",s:4,d:2,ty:"single",q:"Your team shares a GitHub MCP server that requires a personal access token for authentication. You also run an experimental MCP server for a side project that you don't want to appear in teammates' environments. How should these two servers be configured?",o:[{l:"A",t:"Both servers in the project's .mcp.json file, with the GitHub token pasted directly so teammates don't need to configure anything"},{l:"B",t:"The shared GitHub server in project-scoped .mcp.json using environment variable expansion (e.g., ${GITHUB_TOKEN}) to keep the credential out of version control; the personal experimental server in user-scoped ~/.claude.json"},{l:"C",t:"Both servers in ~/.claude.json with setup instructions in the team wiki"},{l:"D",t:"The shared server in CLAUDE.md as a configuration instruction and the personal one in .claude/commands/"}],a:["B"],r:"Scoping follows audience: .mcp.json (project-scoped, version-controlled) distributes team tooling to all developers, with ${VAR} expansion keeping credentials out of the repo. ~/.claude.json (user-scoped) holds personal servers that stay private.",w:"A commits a live credential to version control; C makes shared infrastructure a manual per-developer chore; D puts server config in files that don't configure servers."},
{id:"Q48",s:4,d:2,ty:"single",q:"Your agent consistently prefers the built-in Grep tool over a custom MCP tool that provides semantic code search - understanding function relationships, type hierarchies, and call graphs beyond simple text matching. When asked to \"find all code affected by changing the User interface,\" the agent runs Grep for the string \"User\" and returns hundreds of irrelevant matches instead of using the semantic search tool that would return precisely the affected code. What is the likely cause and fix?",o:[{l:"A",t:"The MCP tool is broken and not returning results"},{l:"B",t:"The MCP tool's description doesn't adequately explain its semantic search capabilities - enhancing the description to clearly differentiate it from text-based Grep shifts the model's tool selection preference"},{l:"C",t:"Built-in tools are always preferred over MCP tools - this is expected and cannot be changed"},{l:"D",t:"The agent needs a larger context window to evaluate both tools' outputs before choosing"}],a:["B"],r:"When a model consistently favors a built-in tool over a more capable MCP tool, the MCP tool's description usually doesn't make its advantage clear. Enhancing the description with specific capabilities, use-case examples, and explicit differentiation from Grep shifts the model's selection behavior.",w:"A assumes a technical failure when it's a description quality issue; C is false - MCP tools compete on description quality; D addresses post-hoc evaluation, not selection."},
{id:"Q49",s:4,d:5,ty:"multi",se:2,q:"During a multi-hour codebase exploration session, your agent begins giving increasingly vague responses. Asked about the UserAuth class it discovered two hours ago, it describes \"typical authentication patterns\" instead of the specific methods, decorators, and middleware it found in the actual codebase. This context degradation is making the agent unreliable but the investigation isn't complete. Which TWO practices counteract this?",o:[{l:"A",t:"Switch to a model with a larger context window and continue accumulating the full conversation"},{l:"B",t:"Maintain a scratchpad file recording key findings (class names, method signatures, architectural decisions) as they are discovered, and have the agent reference it for subsequent questions"},{l:"C",t:"Ask the agent to \"try harder\" or \"be more specific\" in each follow-up question"},{l:"D",t:"Delegate verbose investigation tasks (\"find all test files,\" \"trace the auth middleware chain\") to subagents that return distilled summaries, keeping the main session's context for high-level coordination"},{l:"E",t:"Repeat important questions word-for-word in each message so the model sees them more recently"}],a:["B","D"],r:"Both practices manage what occupies the finite context: a scratchpad persists precise findings outside the degrading conversation history, and subagent delegation keeps verbose exploration output out of the main context entirely, returning only distilled summaries.",w:"A postpones the same degradation at higher cost; C adds text without removing noise; E consumes more context with repetition."},
